appId: ${APP_ID}
tags:
  - smoke
  - auth
  - ios-only
# Sur iOS, le login se fait entièrement dans la WebView (SPA + OIDC mockée du back-staging).
# TODO : découvrir le formulaire de login via `just studio platform=ios`.
---
- runFlow: ../../subflows/_launch.yaml
- runFlow: ../../elements/_loadAll.yaml

# Sélectionner la review app
- extendedWaitUntil:
    visible: "${output.reviewPicker_title}"
    timeout: 10000
- tapOn:
    index: 0
    childOf:
      text: "${output.reviewPicker_title}"

# TODO : taper le bouton FranceConnect dans la WebView SPA
# TODO : remplir le formulaire de login mock (login: test, password: 123) dans la WebView
# TODO : submit → la SPA reçoit le token et charge l'interface principale

# Indicateur de succès : le bouton natif "AMI ◁" N'est PAS visible (on n'est pas sur une page OIDC)
# et la WebView est sur l'URL racine (SPA en état authentifié)
- extendedWaitUntil:
    notVisible:
      text: "AMI"  # bouton back OIDC disparaît quand on revient sur l'app
    timeout: 30000
    optional: true
