appId: ${APP_ID}
tags:
  - ios-only
# Sur iOS, le bouton "Télécharger les logs" est natif (HomeView.swift:88) et ouvre UIActivityViewController.
# Il apparaît uniquement quand l'URL de la WebView se termine par /#/contact.
---
- runFlow: ../../subflows/_launch.yaml
- runFlow: ../../elements/_loadAll.yaml

# Sélectionner la review app (staging)
- extendedWaitUntil:
    visible: "${output.reviewPicker_title}"
    timeout: 10000
- tapOn:
    index: 0
    childOf:
      text: "${output.reviewPicker_title}"

# TODO : login iOS (sélecteurs WebView à découvrir via `just studio platform=ios`)
# TODO : naviguer vers /#/contact dans la SPA
- extendedWaitUntil:
    visible: "${output.logs_button}"
    timeout: 30000
- tapOn: "${output.logs_button}"

# UIActivityViewController iOS → chercher "Copier" ou "AirDrop" dans le share sheet
- extendedWaitUntil:
    visible: "${output.logs_share_hint}"
    timeout: 10000
