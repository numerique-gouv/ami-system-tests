appId: ${APP_ID}
tags:
  - offline
  - ios-only
# Prérequis : réseau coupé via xcrun simctl (contrôlé par le justfile).
# Sur iOS, l'état hors-ligne affiche InformationBanner avec "Vous êtes hors ligne" (AMIAppState.swift).
---
- runFlow: ../../subflows/_launch.yaml
- runFlow: ../../elements/_loadAll.yaml

- extendedWaitUntil:
    visible: "${output.offline_indicator}"
    timeout: 15000
- assertVisible: "${output.offline_title}"
