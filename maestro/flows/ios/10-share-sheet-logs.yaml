appId: ${APP_ID}
tags:
  - ios-only
# iOS spécifique : "Télécharger les logs" ouvre UIActivityViewController (share sheet natif iOS).
# Distinct du flow 07 (commun) : celui-ci vérifie le comportement iOS du share sheet en détail.
---
- runFlow: ../../subflows/_launch.yaml
- runFlow: ../../elements/_loadAll.yaml

# TODO : naviguer vers /#/contact dans la SPA pour faire apparaître le bouton
- extendedWaitUntil:
    visible: "${output.logs_button}"
    timeout: 30000
- tapOn: "${output.logs_button}"

# UIActivityViewController iOS
- extendedWaitUntil:
    visible: "${output.logs_share_hint}"
    timeout: 10000

# Fermer le share sheet sans partager (tap en dehors ou bouton Annuler)
- tapOn:
    text: "Annuler"
    optional: true
