appId: ${APP_ID}
tags:
  - auth
  - ios-only
# Sur iOS, user_logged_out est déclenché par le JS de la SPA → AMIAppState clear du token
# → HomeView recharge vers l'URL racine non-auth.
---
- runFlow: ../../subflows/_launch.yaml
- runFlow: ../../elements/_loadAll.yaml

# Sélectionner la review app (staging)
- extendedWaitUntil:
    visible: "${output.reviewPicker_title}"
    timeout: 10000
- tapOn:
    index: 0
    childOf:
      text: "${output.reviewPicker_title}"

# TODO : login iOS (sélecteurs WebView à découvrir via `just studio platform=ios`)
# TODO : déclencher le logout via le bouton de déconnexion de la SPA
# TODO : déclencher le logout via le bouton de déconnexion de la SPA dans la WebView

# Après logout, la SPA redirige vers sa page d'auth (FranceConnect)
# Le bouton "AMI ◁" n'est pas visible (on est sur l'URL root, pas OIDC)
# Vérifier un élément stable de la page d'auth de la SPA (à préciser via studio)
- extendedWaitUntil:
    visible:
      text: "FranceConnect"
    timeout: 30000
