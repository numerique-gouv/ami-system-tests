appId: ${APP_ID}
tags:
  - notifications
# Scénario vanilla : notification reçue dans l'inbox in-app malgré refus OS à l'onboarding.
# 1. Login FC sandbox test/123 → décline notifs à l'onboarding (OS ne les autorise pas)
# 2. Ouvre l'inbox cloche → mémorise le titre courant en tête (old_top_notif)
# 3. Génère un notif_name horodaté unique à ce run
# 4. Publie la notif avec ce titre via l'API partenaire
# 5. Pull-to-refresh l'inbox → le nouveau titre apparaît en tête
---
- runFlow: ../../subflows/_launch.yaml
- runFlow: ../../subflows/auth/login.yaml
- runFlow: ../../subflows/onboarding/dismiss.yaml
- runFlow: ../../subflows/webview/wait-loaded.yaml

- runFlow: ../../subflows/notifications/open-inbox.yaml

- evalScript: ${output.notif_name = 'AMI-vanilla-' + Date.now()}

- runFlow:
    file: ../../subflows/notifications/publish.yaml
    env:
      NOTIF_TITLE: ${output.notif_name}
      NOTIF_BODY: "Test vanilla — push OS non autorisé, doit apparaître dans l'inbox"

- runFlow:
    file: ../../subflows/notifications/refresh-inbox.yaml
    env:
      EXPECTED_TITLE: ${output.notif_name}
