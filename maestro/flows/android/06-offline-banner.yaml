appId: ${APP_ID}
tags:
  - offline
  - android-only
# Prérequis : le réseau doit être coupé AVANT de lancer ce flow.
# Utiliser la recette : just test-offline-android
---
- runFlow: ../../subflows/_launch.yaml
- runFlow: ../../elements/_loadAll.yaml

- extendedWaitUntil:
    visible: "${output.offline_indicator}"
    timeout: 15000
- assertVisible: "${output.offline_title}"
- assertVisible: "${output.offline_desc}"
