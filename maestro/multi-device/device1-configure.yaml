appId: ${APP_ID}
tags:
  - multi-device
---
- runFlow: ../elements/loadElements.yaml
- runFlow: ../subflows/_launch.yaml
- runFlow: ../subflows/_login.yaml

- tapOn:
    id: ${output.settings.tab}

- tapOn:
    id: ${output.settings.inviteButton}

- assertVisible:
    id: ${output.settings.inviteCode.label}

- copyTextFrom:
    id: ${output.settings.inviteCode.value}

- runScript:
    file: ../scripts/signal-write.js
    env:
      SIGNAL_FILE: /tmp/ami-invite-signal.json
      SIGNAL_DATA: '{"inviteCode": "${clipboard}"}'

- assertVisible:
    id: ${output.multidevice.invitePending}
