appId: ${APP_ID}
tags:
  - multi-device
---
- runFlow: ../elements/loadElements.yaml
- runFlow: ../subflows/_launch.yaml

- runScript:
    file: ../scripts/signal-wait.js
    env:
      SIGNAL_FILE: /tmp/ami-invite-signal.json
      TIMEOUT_MS: "20000"

- tapOn:
    id: ${output.onboarding.startButton}

- tapOn:
    id: ${output.multidevice.inviteCodeInput}

- inputText: ${output.data.inviteCode}

- tapOn:
    id: ${output.multidevice.inviteValidate}

- assertVisible:
    id: ${output.multidevice.partnerLinked}
