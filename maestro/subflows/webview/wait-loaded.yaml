appId: ${APP_ID}
# Subflow : attend que la WebView home soit chargée après authentification.
# Deux indicateurs combinés :
#   1. Négatif  : fc_button disparaît (SPA quitte la page login)
#   2. Positif  : settings_open_button apparaît (avatar profil → SPA home authentifiée)
# Sans l'indicateur positif, le check négatif peut passer prématurément sur iOS
# quand SFSafariViewController couvre la WKWebView (OIDC pas encore terminé).
---
- runFlow: ../../elements/_loadAll.yaml

- runFlow:
      when:
          visible:
              text: "${output.fc_button}"
      commands:
          - tapOn: "${output.fc_button}"

# Vérification positive : attendre que l'avatar profil apparaisse.
# Timeout long (60s) pour couvrir le temps du flow OIDC en SFSafariViewController.

- extendedWaitUntil:
    visible: "${output.settings_open_button}"
    timeout: 60000
