appId: ${APP_ID}
# Subflow : ferme l'onboarding notifications si affiché (no-op sinon).
# L'onboarding n'apparaît qu'au premier login — ne pas en faire une précondition obligatoire
# dans les flows qui ne testent pas l'onboarding lui-même.
---
- runFlow: ../../elements/_loadAll.yaml

- extendedWaitUntil:
    visible: "${output.onboarding_title}"
    timeout: 5000
    optional: true
- tapOn:
    text: "${output.onboarding_later}"
    optional: true
- extendedWaitUntil:
    notVisible: "${output.onboarding_title}"
    timeout: 10000
    optional: true
