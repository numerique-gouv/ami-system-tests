appId: ${APP_ID}
# Subflow : active les notifications depuis l'onboarding.
# Pré-condition : l'onboarding est visible.
---
- runFlow: ../../elements/_loadAll.yaml

- extendedWaitUntil:
    visible: "${output.onboarding_title}"
    timeout: 20000
- tapOn: "${output.onboarding_enable}"
# Le système OS affiche la dialog de permission notifications → accepter via os_allow_button.
# iOS : "Autoriser" (UNUserNotificationCenter dialog)
# Android : "Autoriser" (Android 13+ permission dialog)
- extendedWaitUntil:
    visible:
      text: "${output.os_allow_button}"
    timeout: 5000
    optional: true
- tapOn:
    text: "${output.os_allow_button}"
    optional: true
