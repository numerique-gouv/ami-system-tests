appId: ${APP_ID}
# Ouvre l'inbox in-app via l'icône cloche du header SPA et mémorise la notif courante en tête.
# Post-condition : output.old_top_notif = titre de la 1ère notif (ou "" si inbox vide / inaccessible).
---
- runFlow: ../../elements/_loadAll.yaml

- tapOn: "${output.notification_icon}"

- extendedWaitUntil:
    visible:
      text: "Notifications"
    timeout: 10000

# index: 0 = heading "Notifications", index: 1 = titre de la 1ère notif de la liste.
# À ajuster avec `just hierarchy` si la structure du DOM Svelte diffère.
- copyTextFrom:
    text: ".+"
    index: 1
    optional: true
- evalScript: ${output.old_top_notif = maestro.copiedText || ''}
