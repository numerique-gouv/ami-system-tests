appId: ${APP_ID}
# Pull-to-refresh sur l'inbox puis attente du titre attendu.
# Variables attendues (passées via runFlow: env:) :
#   EXPECTED_TITLE — titre exact dont l'apparition valide l'assertion.
# Repli si la SPA ne se rafraîchit pas au swipe : remplacer par back + tapOn notification_icon.
---
- swipe:
    direction: DOWN
    duration: 600
- extendedWaitUntil:
    visible:
      text: "${EXPECTED_TITLE}"
    timeout: 20000
