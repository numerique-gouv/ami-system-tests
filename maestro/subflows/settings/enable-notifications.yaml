appId: ${APP_ID}
# Active les notifications depuis l'écran Paramètres natif.
# Bascule le toggle puis accepte la dialog de permission OS si elle apparaît (premier tap).
# Pré-condition : SettingsScreen/SettingsView est ouvert (settings/open.yaml appelé avant).
---
- runFlow: ../../elements/_loadAll.yaml

- runFlow: toggle-notifications.yaml
# Dialog système de permission notifications (Android 13+ et iOS)
- extendedWaitUntil:
    visible:
      text: "${output.os_allow_button}"
    timeout: 5000
    optional: true
- tapOn:
    text: "${output.os_allow_button}"
    optional: true
