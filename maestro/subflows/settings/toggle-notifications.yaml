appId: ${APP_ID}
# Subflow Android : active les notifications depuis l'écran Paramètres natif.
# Extrait de toggle-notifications.yaml — appelé par le dispatcher when: platform: Android.
# Pré-condition : SettingsScreen est ouvert (settings/open.yaml appelé avant).
---
- runFlow: ../../elements/_loadAll.yaml

# Ouvre le sous-menu notifications
- extendedWaitUntil:
    visible:
      id: "notification-icon"
    timeout: 5000
- tapOn:
    id: "notification-icon"

- extendedWaitUntil:
    visible:
      text: ".*Gérer"
    timeout: 5000
- tapOn: ".*Gérer"

# Toggle la notification
- extendedWaitUntil:
    visible:
      text: "${output.settings_notif_label}"
    timeout: 5000
- tapOn: "${output.settings_notif_label}"

# Dialog système de permission notifications (Android 13+)
- extendedWaitUntil:
    visible:
      text: "${output.os_allow_button}"
    timeout: 5000
    optional: true
- tapOn:
    text: "${output.os_allow_button}"
    optional: true
- extendedWaitUntil:
    notVisible:
      text: "${output.os_allow_button}"
    timeout: 5000
    optional: true

# Ferme les écrans de préférence (remontée via Retour)
- extendedWaitUntil:
    visible:
      text: "${output.settings_notif_label}"
    timeout: 5000
- tapOn: "Retour.*"
- extendedWaitUntil:
    visible:
      text: "${output.settings_menu_prefs_notif}"
    timeout: 5000
- tapOn: "Retour.*"
