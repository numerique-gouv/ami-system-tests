appId: ${APP_ID}
# Subflow : ouvre l'écran Paramètres depuis la WebView home au travers du menu de l'avatar
#### ce menu est invisible de l'accessibility tree, il ne reste que du click par position, en s'assurant que le bandeau "notfi activées" est fermé ####
#### c'est très fragile et abandonné AVANT d'être fonctionnel ####
# Android : avatar "A" → menu → "Préférences" → URL /#/settings → WebViewScreen l'intercepte → SettingsScreen.
# iOS : même menu → sheet SettingsView.
# Pré-condition : la WebView home est chargée (avatar profil "A" visible).
---
- runFlow: ../../elements/_loadAll.yaml

# Ferme le bandeau "Les notifications ont été activées" s'il est visible.
# La croix (accessibilityText: "close", bounds [975,205][1017,247]) est visible
# dans l'arbre natif Android — tap par accessibilityText suffit.
- runFlow:
    when:
      visible:
        regexp: "Les notifications ont été.*"
    commands:
      - tapOn: "close" # not found

- tapOn:
    text: "${output.settings_open_button}"

# Les items du menu dropdown WebView ne remontent pas dans l'arbre d'accessibilité Android
# (essais text:, extendedWaitUntil, pressKey: Tab échouent tous).
# Tap par coordonnées : "Préférences" est toujours au même endroit car l'avatar
# ne fonctionne pas si le bandeau notifications activées est présent.
# point: x≈20% (menu drawer à gauche), y≈17% (2e item du menu).
- extendedWaitUntil:
      visible: "${output.settings_menu_prefs}"
      timeout: 5000
      optional: true

# Tap "Préférences" : le bandeau est fermé au-dessus, position toujours stable.
# x≈20% (menu drawer à gauche), y≈17% (2e item du menu, mesuré sur Pixel_modern).
- tapOn:
    point: "20%, 17%"

- extendedWaitUntil:
    visible: "${output.settings_title}"
    timeout: 15000
