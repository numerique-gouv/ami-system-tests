appId: ${APP_ID}
# Subflow Android : ouvre l'écran Paramètres depuis la WebView home via le menu avatar.
# Extrait de open.yaml — appelé par le dispatcher when: platform: Android.
#
# AVERTISSEMENT : le menu dropdown de l'avatar est invisible dans l'arbre d'accessibilité
# Android (WebView Svelte non exposée). Tap par coordonnées (20%, 17%) utilisé en dernier
# recours — fragile si le layout change ou si le bandeau "notifs activées" est visible.
# Pré-condition : la WebView home est chargée (avatar profil visible).
---
- runFlow: ../../elements/_loadAll.yaml

# Ferme le bandeau "Les notifications ont été activées" s'il est visible.
- runFlow:
    when:
      visible:
        text: "Les notifications ont été.*"
    commands:
      - tapOn: "close" # not found

- tapOn:
    text: "${output.settings_open_button}"

- extendedWaitUntil:
    visible: "${output.settings_menu_prefs}"
    timeout: 5000
    optional: true

# Tap "Préférences" : position toujours stable si le bandeau est absent.
- tapOn:
    point: "20%, 17%"

- extendedWaitUntil:
    visible: "${output.settings_title}"
    timeout: 15000
