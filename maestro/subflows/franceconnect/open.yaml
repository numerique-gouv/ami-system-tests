appId: ${APP_ID}
# Subflow : s'assure d'être sur l'écran FranceConnect après le lancement.
# Flavor local : FranceConnexionScreen est l'écran de démarrage direct.
# Flavor staging : si le review-picker est visible, taper la première entrée d'abord.
# Pré-condition : _launch.yaml a déjà été appelé.
---
- runFlow: ../../elements/_loadAll.yaml

# Sur staging uniquement : attendre que les items du LazyColumn soient chargés,
# puis sélectionner l'environnement "Staging". Le titre "Choix de la review" apparaît
# avant les items (lazy loading), d'où l'attente dédiée.
- extendedWaitUntil:
    visible:
      text: "${output.reviewPicker_default}"
    timeout: 8000
    optional: true
- tapOn:
    text: "${output.reviewPicker_default}"
    optional: true

- extendedWaitUntil:
    visible: "${output.fc_button}"
    timeout: 15000
