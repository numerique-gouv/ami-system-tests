appId: ${APP_ID}
# Subflow : navigue jusqu'à l'écran FranceConnect puis s'authentifie (staging).
# 1. Si review-picker visible (staging) → sélectionner l'environnement par défaut
# 2. Attendre l'écran FranceConnexionScreen
# 3. Tap sur le bouton FC natif → WebView OIDC s'ouvre
# 4. Android : interactions eiDAS + FCP-LOW (WebView accessible via Maestro)
#    iOS     : le flow OIDC se déroule dans SFSafariViewController (non accessible à Maestro)
#              — le serveur staging complète l'authentification automatiquement
# Pré-condition : _launch.yaml a été appelé.
---
- runFlow: ../../elements/_loadAll.yaml

# Sur staging uniquement : attendre que les items du LazyColumn soient chargés,
# puis sélectionner l'environnement "Staging".
- extendedWaitUntil:
    visible:
      text: "${output.reviewPicker_default}"
    timeout: 8000
    optional: true
- tapOn:
    text: "${output.reviewPicker_default}"
    optional: true

- extendedWaitUntil:
    visible: "${output.fc_button}"
    timeout: 15000

- tapOn: "${output.fc_button}"


# Formulaire FCP-LOW — uniquement si l'écran de sélection eiDAS est visible.
# Sur iOS en staging, le serveur peut compléter le flux OIDC automatiquement (pas de formulaire).
# Sur Android (et iOS si le serveur exige la saisie), ".*faible.*" apparaît → FC_login s'exécute.
- runFlow:
    when:
      visible:
        text: ".*faible.*"
    file: ../franceconnect/FC_login.yaml
