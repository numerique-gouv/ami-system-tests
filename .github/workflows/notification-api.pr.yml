name: Notification API — PR

# Point d'entrée manuel : pour un environnement donné (review app ou "staging"),
# déclenche au choix les suites webapp / Android / iOS — chacune un workflow
# réutilisable appelé en parallèle (`notification-api.webapp.yml`,
# `notification-api.android.yml`, `notification-api.ios.yml`).
on:
  workflow_dispatch:
    inputs:
      ref_name:
        description: "Nom de branche / environnement cible (mappé sur AMI_ENV)"
        type: string
        default: staging
      run_webapp:
        description: "Lancer la suite webapp"
        type: boolean
        default: false
      run_android:
        description: "Lancer la suite Android"
        type: boolean
        default: false
      run_old_device:
        description: "Suite Android : appareil ancien (Pixel 6) au lieu du plus récent (Pixel 8)"
        type: boolean
        default: true
      run_ios:
        description: "Lancer la suite iOS"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  webapp:
    if: ${{ inputs.run_webapp }}
    uses: ./.github/workflows/notification-api.webapp.yml
    with:
      ref_name: ${{ inputs.ref_name }}
      run_webapp: ${{ inputs.run_webapp }}
    secrets: inherit

  android:
    if: ${{ inputs.run_android }}
    uses: ./.github/workflows/notification-api.android.yml
    with:
      ref_name: ${{ inputs.ref_name }}
      run_android: ${{ inputs.run_android }}
      run_old_device: ${{ inputs.run_old_device }}
    secrets: inherit

  ios:
    if: ${{ inputs.run_ios }}
    uses: ./.github/workflows/notification-api.ios.yml
    with:
      ref_name: ${{ inputs.ref_name }}
      run_ios: ${{ inputs.run_ios }}
    secrets: inherit
