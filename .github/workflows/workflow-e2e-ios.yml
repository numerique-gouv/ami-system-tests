name: workflow-e2e-ios.yml
on:
  workflow_call:
    inputs:
      checkout_ref:
        description: "ref (branche/tag/sha) d'ami-system-tests à checkout"
        type: string
        required: true
      suite:
        description: "nom de la suite ios à lancer (test-suites.ts)"
        type: string
        default: ''

permissions:
  contents: read

jobs:
  sample:
    runs-on: macos-latest
    steps:
      - env:
          SUITE: ${{ inputs.suite }}
        run: echo "hello world of iOS — suite $SUITE"
