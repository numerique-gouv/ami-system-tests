name: workflow-e2e-main.yml
on:
  workflow_call:
    inputs:
      run_webapp:
        description: "nom de la suite webapp à lancer (test-suites.ts, ex: short, CI, all) — vide = ne pas lancer"
        type: string
        default: ''
      run_android:
        description: "nom de la suite android à lancer (test-suites.ts) — vide = ne pas lancer"
        type: string
        default: ''
      run_old_device:
        type: boolean
        default: true
      run_ios:
        description: "nom de la suite ios à lancer (test-suites.ts) — vide = ne pas lancer"
        type: string
        default: ''
      source_repo:
        type: string
        required: true
      source_sha:
        description: "SHA du commit de source_repo dont on attend le déploiement Scalingo avant de lancer les tests"
        type: string
        required: true
      pr_number:
        type: number
        default: 0
      checkout_ref:
        description: "ref (branche/tag/sha) d'ami-system-tests à checkout — doit correspondre au ref utilisé dans le uses: qui pointe vers ce workflow"
        type: string
        required: true
    outputs:
      test_results:
        description: "nom de l'artefact des résultats de tests (JUnit XML dans junit/, dumps des échecs dans failures/), à télécharger par le workflow appelant pour commenter la PR"
        value: ${{ jobs.e2e.outputs.test_results }}

# Un groupe par PR (source_repo + pr_number) : sérialise les runs d'une même PR, qui partagent le même
# environnement Scalingo de review. Les autres PR ont chacune leur propre groupe, donc ne s'attendent pas.
concurrency:
  group: e2e-${{ inputs.source_repo }}-${{ inputs.pr_number }}
  cancel-in-progress: false

jobs:
  # iOS reste isolé : reusable workflow classique → job/VM macOS dédié (pas de partage de
  # disque avec webapp/android), tant que la CI macOS est en pause.
  ios:
    if: ${{ inputs.run_ios != '' }}
    uses: ./.github/workflows/workflow-e2e-ios.yml
    with:
      checkout_ref: ${{ inputs.checkout_ref }}
      suite: ${{ inputs.run_ios }}
    secrets: inherit

  # webapp + android partagent un seul job (même VM, même checkout, même node_modules, même dossier test-results)
  # iOS a besoin d'un MacOs (10x plus cher qu'Ubuntu), donc d'une autre VM, donc d'un autre job avec transmission des résultats par upload et download d'artefacts.
  e2e:
    if: ${{ inputs.run_webapp != '' || inputs.run_android != '' }}
    name: webapp + android (shared VM)
    runs-on: ubuntu-latest
    env:
      AMI_ENV: ${{ inputs.pr_number != 0 && inputs.pr_number || 'staging' }}
      NOTIF_PARTNER_ID: ${{ secrets.NOTIF_PARTNER_ID }}
      NOTIF_PARTNER_SECRET: ${{ secrets.NOTIF_PARTNER_SECRET }}
      WEB_APP_ACCESS_KEYS: ${{ secrets.WEB_APP_ACCESS_KEYS }}
    outputs:
      test_results: ${{ steps.publish-results.outputs.test_results }}
    steps:
      # checkout_ref porte le nom de branche de source_repo (ex. notifications-api),
      # On tente d'abord la ref demandée ; si elle n'existe pas, actions/checkout 
      # échoue et le step suivant (déclenché par outcome == 'failure') retombe sur main.
      - name: checkout ami-system-tests (ref demandée)
        id: checkout-ref
        continue-on-error: true
        uses: actions/checkout@v7
        with:
          repository: numerique-gouv/ami-system-tests
          ref: ${{ inputs.checkout_ref }}
          path: ami-system-tests

      - name: checkout ami-system-tests (fallback main)
        if: steps.checkout-ref.outcome == 'failure'
        uses: actions/checkout@v7
        with:
          repository: numerique-gouv/ami-system-tests
          ref: main
          path: ami-system-tests

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ami-system-tests/package-lock.json

      - working-directory: ami-system-tests
        run: npm ci

      - uses: extractions/setup-just@v4

      - if: ${{ inputs.run_webapp != '' }}
        uses: ./ami-system-tests/.github/actions/e2e-webapp
        with:
          suite: ${{ inputs.run_webapp }}

      - if: ${{ inputs.run_android != '' }}
        uses: ./ami-system-tests/.github/actions/e2e-android
        with:
          suite: ${{ inputs.run_android }}
          run_old_device: ${{ inputs.run_old_device }}

      - if: ${{ inputs.run_ios != '' }}
        name: download iOS test results
        run: echo TODO télécharger l'artefact de résultats iOS (JUnit et dumps) dans ami-system-tests/test-results

      # source_repo (contient "/") + pr_number → identifiant utilisable comme nom d'artifact
      - name: calculer la clé d'isolation (slug)
        id: slug
        if: ${{ always() }}
        run: |
          RAW="${{ inputs.source_repo }}-pr${{ inputs.pr_number }}"
          SLUG=$(echo "$RAW" | sed 's/[\/:<>|*?\\"]/-/g')
          echo "slug=$SLUG" >> "$GITHUB_OUTPUT"

      # Résumé passants/cassés dans la page du run. `annotate_only` : pas de check run (donc pas de `checks: write`) et
      # `job_summary` pour le tableau. Le commentaire sur la PR d'origine est posté par le workflow APPELANT (cf.
      # workflow-e2e-main.yml appelé depuis ami-notifications-api) : ce token n'a pas de droit sur l'autre dépôt.
      # Action tierce épinglée par SHA de commit (mikepenz/action-junit-report v6.6.0, Apache-2.0) : ne jamais la
      # référencer par tag. Non vérifiée en CI réelle depuis la migration (testée seulement en lecture de sa doc).
      - name: résumé des tests (JUnit)
        if: ${{ always() }}
        uses: mikepenz/action-junit-report@b7b80d7ac5b1da46d6aaff9fb57ad50d8453bcb3 # v6.6.0
        with:
          report_paths: ami-system-tests/test-results/junit/*.xml
          annotate_only: true
          job_summary: true
          detailed_summary: true
          fail_on_failure: false
          require_tests: false

      # JUnit XML (résumé) et dumps des échecs (capture, DOM ou arbre natif, identifiants Sentry) : un seul artefact.
      - name: publier les résultats de tests
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ steps.slug.outputs.slug }}-run${{ github.run_number }}
          path: ami-system-tests/test-results
          retention-days: 14
          if-no-files-found: warn

      # Nom de l'artefact exposé en output `test_results` — à télécharger côté appelant, qui commente la PR d'origine.
      - name: nom de l'artefact des résultats
        id: publish-results
        if: ${{ always() }}
        run: echo "test_results=test-results-${{ steps.slug.outputs.slug }}-run${{ github.run_number }}" >> "$GITHUB_OUTPUT"
