name: workflow-e2e-main.yml
on:
  workflow_call:
    inputs:
      run_webapp:
        description: "nom de la suite webapp à lancer (test-suites.ts, ex: short, CI, all) — vide = ne pas lancer"
        type: string
        default: ''
      run_android:
        description: "nom de la suite android à lancer (test-suites.ts) — vide = ne pas lancer"
        type: string
        default: ''
      run_old_device:
        type: boolean
        default: true
      run_ios:
        description: "nom de la suite ios à lancer (test-suites.ts) — vide = ne pas lancer"
        type: string
        default: ''
      source_repo:
        type: string
        required: true
      source_sha:
        description: "SHA du commit de source_repo dont on attend le déploiement Scalingo avant de lancer les tests"
        type: string
        required: true
      pr_number:
        type: number
        default: 0
      checkout_ref:
        description: "ref (branche/tag/sha) d'ami-system-tests à checkout — doit correspondre au ref utilisé dans le uses: qui pointe vers ce workflow"
        type: string
        required: true
    outputs:
      allure_report:
        description: "nom de l'artefact allure-results publié par le job e2e, à télécharger par le workflow appelant"
        value: ${{ jobs.e2e.outputs.allure_report }}

# Un groupe par PR (source_repo + pr_number : sérialise les runs d'une même PR, la
# restauration/publication de l'historique Allure étant un cycle lecture-modification-écriture
# non concurrent-safe. Les autres PR ont chacune leur propre groupe, donc ne s'attendent pas.
concurrency:
  group: allure-${{ inputs.source_repo }}-${{ inputs.pr_number }}
  cancel-in-progress: false

jobs:
  # iOS reste isolé : reusable workflow classique → job/VM macOS dédié (pas de partage de
  # disque avec webapp/android), tant que la CI macOS est en pause.
  ios:
    if: ${{ inputs.run_ios != '' }}
    uses: ./.github/workflows/workflow-e2e-ios.yml
    with:
      checkout_ref: ${{ inputs.checkout_ref }}
      suite: ${{ inputs.run_ios }}
    secrets: inherit

  # webapp + android partagent un seul job (même VM, même checkout, même node_modules, même allure-report)
  # iOS a besoin d'un MacOs (10x plus cher qu'Ubuntu), donc d'une autre VM, donc d'un autre job avec transimission de rapport Aluure par upload et download d'artefacts.
  e2e:
    if: ${{ inputs.run_webapp != '' || inputs.run_android != '' }}
    name: webapp + android (shared VM)
    runs-on: ubuntu-latest
    env:
      AMI_ENV: ${{ inputs.pr_number != 0 && inputs.pr_number || 'staging' }}
      NOTIF_PARTNER_ID: ${{ secrets.NOTIF_PARTNER_ID }}
      NOTIF_PARTNER_SECRET: ${{ secrets.NOTIF_PARTNER_SECRET }}
      WEB_APP_ACCESS_KEYS: ${{ secrets.WEB_APP_ACCESS_KEYS }}
    outputs:
      allure_report: ${{ steps.publish-allure.outputs.allure_report }}
    steps:
      - uses: actions/checkout@v7
        with:
          repository: numerique-gouv/ami-system-tests
          ref: ${{ inputs.checkout_ref }}
          path: ami-system-tests

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ami-system-tests/package-lock.json

      - working-directory: ami-system-tests
        run: npm ci

      - uses: extractions/setup-just@v4

      - if: ${{ inputs.run_webapp != '' }}
        uses: ./ami-system-tests/.github/actions/e2e-webapp
        with:
          suite: ${{ inputs.run_webapp }}

      - if: ${{ inputs.run_android != '' }}
        uses: ./ami-system-tests/.github/actions/e2e-android
        with:
          suite: ${{ inputs.run_android }}

      - if: ${{ inputs.run_ios != '' }}
        name: download iOS allure results
        run: echo TODO download allure artefact

      # source_repo (contient "/") + pr_number → identifiant utilisable comme nom d'artifact
      - name: calculer la clé d'isolation (slug)
        id: slug
        run: |
          RAW="${{ inputs.source_repo }}-pr${{ inputs.pr_number }}"
          SLUG=$(echo "$RAW" | sed 's/[\/:<>|*?\\"]/-/g')
          echo "slug=$SLUG" >> "$GITHUB_OUTPUT"

      # Allure 3 : l'historique est un unique fichier JSONL, mis à jour en place par
      # `allure generate` (lu ET ré-écrit, cf. allurerc.mjs historyPath) — plus le dossier
      # allure-report/history/ d'Allure 2. Sans lui, les compteurs new/flaky/retry et les
      # tendances restent à zéro. Absent au premier run d'une PR : ne fait pas échouer le job.
      # continue-on-error : un aléa transitoire de l'API GitHub (5xx, rate-limit) ne doit pas
      # faire échouer tout le run e2e pour un historique de tendances — dégradé mais fonctionnel
      # (found reste vide, donc absent du if du step suivant, comme un vrai premier run).
      - name: chercher l'historique Allure de la PR
        id: history
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ARTIFACT=$(gh api "repos/${{ github.repository }}/actions/artifacts?name=allure-history-${{ steps.slug.outputs.slug }}&per_page=100" \
            --jq '[.artifacts[] | select(.expired == false)] | sort_by(.created_at) | last')
          if [ -z "$ARTIFACT" ] || [ "$ARTIFACT" = "null" ]; then
            echo "Aucun historique existant — premier run de cette PR, ou artifact renommé/expiré."
            echo "found=false" >> "$GITHUB_OUTPUT"
          else
            echo "found=true" >> "$GITHUB_OUTPUT"
            echo "artifact_id=$(echo "$ARTIFACT" | jq -r '.id')" >> "$GITHUB_OUTPUT"
          fi

      # continue-on-error : l'artifact repéré ci-dessus peut avoir expiré/être supprimé entre les
      # deux steps (course bénigne) — un historique manquant ne doit jamais faire échouer le run,
      # seulement repartir sans tendances pour ce run.
      - name: restaurer l'historique Allure de la PR
        if: steps.history.outputs.found == 'true'
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ steps.history.outputs.artifact_id }}
          path: ami-system-tests/.allure
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # Legacy mais toujours lu par Allure 3 (cf. how-it-works-executor-file) : sans lui, les
      # points de la courbe de tendance ne sont pas identifiables (build, lien vers le run).
      - name: écrire executor.json
        working-directory: ami-system-tests
        run: |
          mkdir -p allure-results
          cat > allure-results/executor.json <<EOF
          {
            "name": "GitHub Actions",
            "type": "github",
            "buildName": "PR #${{ inputs.pr_number }} — run ${{ github.run_number }}",
            "buildOrder": ${{ github.run_number }},
            "buildUrl": "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          }
          EOF

      - name: build allure report
        shell: bash
        working-directory: ami-system-tests
        run: just generate-report

      - name: publier le rapport Allure (artefact complet)
        uses: actions/upload-artifact@v4
        with:
          name: allure-report-${{ steps.slug.outputs.slug }}-run${{ github.run_number }}
          path: ami-system-tests/allure-report
          retention-days: 14
          if-no-files-found: warn

      # Consommé par le step "restaurer l'historique" ci-dessus au run suivant de cette PR —
      # seul .allure/history.jsonl (quelques Ko) est conservé, pas le rapport HTML complet
      # (captures d'écran d'échec, ~20 Mo). Rétention longue : doit survivre toute la durée
      # de vie réaliste d'une PR, sinon une PR ouverte plus de 14 jours perdrait sa tendance.
      - name: publier l'historique Allure
        uses: actions/upload-artifact@v4
        with:
          name: allure-history-${{ steps.slug.outputs.slug }}
          path: ami-system-tests/.allure/history.jsonl
          retention-days: 90
          if-no-files-found: warn

      # Nom de l'artefact "rapport complet" (pas les allure-results bruts) exposé en output
      # `allure_report` — à télécharger côté appelant (ex. job e2e-report de
      # workflow-e2e-webapp-shared.yml dans ami-notifications-api), qui appelle lui-même
      # allure-framework/allure-action sur ami-system-tests/allure-report/summary.json (plugin
      # `awesome` d'Allure 3, format désormais compatible avec ce que lit l'action).
      - name: set artifact name
        id: publish-allure
        run: echo "allure_report=allure-report-${{ steps.slug.outputs.slug }}-run${{ github.run_number }}" >> "$GITHUB_OUTPUT"
