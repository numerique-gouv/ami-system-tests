name: workflow-e2e-main.yml
on:
  workflow_call:
    inputs:
      run_webapp:
        description: "nom de la suite webapp à lancer (test-suites.ts : webapp_smoke, webapp_short, webapp_all, webapp_nonreg…) — vide = ne pas lancer"
        type: string
        default: ''
      run_android:
        description: "nom de la suite android à lancer (test-suites.ts : mobile_ci, mobile_short, mobile_all…) — vide = ne pas lancer"
        type: string
        default: ''
      android_device:
        description: "AVD Android au format pixel_<profil>_api<niveau> (ex. pixel_2_api30 = ancien, pixel_8_api36 = récent)"
        type: string
        default: pixel_2_api30
      run_ios:
        description: "RÉSERVÉ, INACTIF : point d'extension iOS, aucun job ne le lit (décision : iOS non développé en CI). Si on change d'avis : ajouter un job macOS ici (reusable workflow dédié), son artefact test-results-<slug>-ios-run<N> et iOS dans `expect` du job report."
        type: string
        default: ''
      source_repo:
        type: string
        required: true
      source_sha:
        description: "SHA du commit de source_repo dont on attend le déploiement Scalingo avant de lancer les tests"
        type: string
        required: true
      pr_number:
        description: "numéro de la PR de source_repo à commenter ; 0 = pas de PR (push/tag) : pas de commentaire"
        type: number
        default: 0
      apk_source:
        description: "origine de l'APK Android : `build` = artefact `app-staging-debug` du run appelant (l'appelant l'a buildé : ami-app-android) ; `latest-tag` = APK du dernier tag d'ami-app-android (artefact `app-staging-debug-<tag>`, rétention 90 jours), retrouvé avec un jeton de la GitHub App ami-reviewapps (variable AMI_REVIEWAPPS_APP_ID, secret AMI_REVIEWAPPS_PRIVATE_KEY du dépôt appelant ; permission actions:read sur ami-app-android)"
        type: string
        default: build
      report_label:
        description: "étiquette (lettres, chiffres, - _) quand le même appelant lance plusieurs runs e2e pour la même PR (ex. old-device) : distingue les artefacts, le check et le commentaire"
        type: string
        default: ''
      comment_pr_number:
        description: "numéro de PR à commenter et clé des artefacts quand il diffère de pr_number (ex. tests Android toujours lancés sur staging avec pr_number 0 mais rattachés à une PR) ; 0 = pr_number"
        type: number
        default: 0
      checkout_ref:
        description: "ref (branche/tag/sha) d'ami-system-tests à checkout — doit correspondre au ref utilisé dans le uses: qui pointe vers ce workflow"
        type: string
        required: true
    outputs:
      test_results:
        description: "motif (glob) des artefacts de résultats de ce run : test-results-<slug>-*-run<N>, utilisable comme `pattern:` de actions/download-artifact. Chaque artefact contient junit/ (JUnit XML enrichi) et traces/<run>/failures/ (dumps des échecs)."
        value: ${{ jobs.report.outputs.test_results }}
      artifact_webapp:
        description: "nom de l'artefact des résultats webapp (vide si run_webapp est vide)"
        value: ${{ jobs.report.outputs.artifact_webapp }}
      artifact_android:
        description: "nom de l'artefact des résultats Android (vide si run_android est vide)"
        value: ${{ jobs.report.outputs.artifact_android }}

# Un groupe par PR (source_repo + pr_number) : sérialise les runs d'une même PR, qui partagent le même
# environnement Scalingo de review. Les autres PR ont chacune leur propre groupe, donc ne s'attendent pas.
concurrency:
  group: e2e-${{ inputs.source_repo }}-${{ inputs.pr_number }}
  cancel-in-progress: false

# Permissions minimales par défaut ; le job `report` ajoute checks/pull-requests. Un workflow appelé ne peut pas dépasser les permissions
# que lui donne son appelant (le workflow appelant doit donc accorder checks: write et pull-requests: write).
permissions:
  contents: read

# Les jobs RESTENT VERTS quand des tests échouent (garde `|| echo` des actions composites e2e-webapp / e2e-android, étape de rapport
# avec fail_on_failure: false) : le résultat se lit dans le check « e2e (ami-system-tests) », le résumé du run et le commentaire de la PR.
jobs:
  # webapp + android partagent un seul job (même VM, même checkout, même node_modules, même dossier test-results)
  e2e:
    if: ${{ inputs.run_webapp != '' || inputs.run_android != '' }}
    name: webapp + android (shared VM)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      AMI_ENV: ${{ inputs.pr_number != 0 && inputs.pr_number || 'staging' }}
      NOTIF_PARTNER_ID: ${{ secrets.NOTIF_PARTNER_ID }}
      NOTIF_PARTNER_SECRET: ${{ secrets.NOTIF_PARTNER_SECRET }}
      WEB_APP_ACCESS_KEYS: ${{ secrets.WEB_APP_ACCESS_KEYS }}
    steps:
      # checkout_ref porte le nom de branche de source_repo (ex. notifications-api),
      # On tente d'abord la ref demandée ; si elle n'existe pas, actions/checkout
      # échoue et le step suivant (déclenché par outcome == 'failure') retombe sur main.
      - name: checkout ami-system-tests (ref demandée)
        id: checkout-ref
        continue-on-error: true
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: numerique-gouv/ami-system-tests
          ref: ${{ inputs.checkout_ref }}
          path: ami-system-tests

      - name: checkout ami-system-tests (fallback main)
        if: steps.checkout-ref.outcome == 'failure'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: numerique-gouv/ami-system-tests
          ref: main
          path: ami-system-tests

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ami-system-tests/package-lock.json

      - working-directory: ami-system-tests
        run: npm ci

      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0

      # source_repo (contient "/") + pr_number → identifiant utilisable comme nom d'artifact (même calcul dans le job `report`
      # et dans e2e-artifacts-cleanup.yml : les trois doivent rester identiques).
      - name: calculer la clé d'isolation (slug)
        id: slug
        if: ${{ always() }}
        env:
          SOURCE_REPO: ${{ inputs.source_repo }}
          PR_NUMBER: ${{ inputs.comment_pr_number != 0 && inputs.comment_pr_number || inputs.pr_number }}
          LABEL: ${{ inputs.report_label }}
        run: |
          LABEL="${LABEL//[^A-Za-z0-9_-]/}"
          RAW="${SOURCE_REPO}-pr${PR_NUMBER}${LABEL:+-$LABEL}"
          SLUG=$(echo "$RAW" | sed 's/[\/:<>|*?\\"]/-/g')
          echo "slug=$SLUG" >> "$GITHUB_OUTPUT"

      - if: ${{ inputs.run_webapp != '' }}
        uses: ./ami-system-tests/.github/actions/e2e-webapp
        with:
          suite: ${{ inputs.run_webapp }}

      # Dernier APK produit par un TAG d'ami-app-android (job publish-version de son workflow-e2e-shared.yml : artefact de workflow
      # `app-staging-debug-<tag>` contenant app-staging-debug.apk + version.json, 90 jours, dépôt privé). Les artefacts sont listés du plus récent
      # au plus ancien (page de 100) ; les expirés sont ignorés. Un échec ici (jeton absent, aucun tag récent) n'arrête pas le job : l'étape Android échouera
      # visiblement sans APK.
      # Jeton d'installation de la GitHub App `ami-reviewapps`, limité à ami-app-android et à `actions: read` (lecture des artefacts), valable
      # 1 h et révoqué en fin de job. L'action masque le jeton dans les logs. Variable/secret À CRÉER dans le dépôt appelant (jamais de valeur
      # dans le code) : variable AMI_REVIEWAPPS_APP_ID et secret AMI_REVIEWAPPS_PRIVATE_KEY (PEM brut, pas le base64 de GITHUB_APP_PRIVATE_KEY de Scalingo).
      - name: jeton de lecture des artefacts d'ami-app-android
        id: app-token
        if: ${{ inputs.run_android != '' && inputs.apk_source == 'latest-tag' }}
        continue-on-error: true
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2.2.2
        with:
          app-id: ${{ vars.AMI_REVIEWAPPS_APP_ID }}
          private-key: ${{ secrets.AMI_REVIEWAPPS_PRIVATE_KEY }}
          owner: numerique-gouv
          repositories: ami-app-android
          permission-actions: read

      - name: trouver l'APK du dernier tag d'ami-app-android
        id: apk
        if: ${{ inputs.run_android != '' && inputs.apk_source == 'latest-tag' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          line=$(gh api "repos/numerique-gouv/ami-app-android/actions/artifacts?per_page=100" \
            --jq '[.artifacts[] | select((.name | startswith("app-staging-debug-")) and (.expired | not))] | sort_by(.created_at) | last | [.name, .workflow_run.id] | @tsv')
          [ -n "$line" ] || { echo "::error::aucun artefact app-staging-debug-<tag> non expiré dans ami-app-android"; exit 1; }
          name=${line%%$'\t'*}
          run_id=${line##*$'\t'}
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "APK Android utilisé : $name (run $run_id de ami-app-android)" >> "$GITHUB_STEP_SUMMARY"

      - if: ${{ inputs.run_android != '' }}
        uses: ./ami-system-tests/.github/actions/e2e-android
        with:
          suite: ${{ inputs.run_android }}
          device: ${{ inputs.android_device }}
          apk-artifact: ${{ steps.apk.outputs.name || 'app-staging-debug' }}
          apk-run-id: ${{ steps.apk.outputs.run_id }}
          apk-repository: numerique-gouv/ami-app-android
          apk-token: ${{ steps.app-token.outputs.token }}

      # Un artefact par plateforme (JUnit enrichi + dumps des échecs). Les dossiers de run sont nommés
      # <horodatage>_<plateforme>_<suite ou spec> (cf. src/helpers/reporting/run-dir.ts) : le motif `*_webapp_*` ne prend que ceux de la webapp.
      # La racine commune des deux chemins est test-results/ : l'artefact contient donc junit/ et traces/, comme le JUnit l'indique (dump_path).
      - name: publier les résultats webapp
        if: ${{ always() && inputs.run_webapp != '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-results-${{ steps.slug.outputs.slug }}-webapp-run${{ github.run_number }}
          path: |
            ami-system-tests/test-results/junit/results-*_webapp_*.xml
            ami-system-tests/test-results/traces/*_webapp_*
          retention-days: 14
          overwrite: true
          if-no-files-found: warn

      - name: publier les résultats Android
        if: ${{ always() && inputs.run_android != '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-results-${{ steps.slug.outputs.slug }}-android-run${{ github.run_number }}
          path: |
            ami-system-tests/test-results/junit/results-*_android_*.xml
            ami-system-tests/test-results/traces/*_android_*
          retention-days: 14
          overwrite: true
          if-no-files-found: warn

  # Rapport : check GitHub + annotations (mikepenz/action-junit-report) et commentaire UNIQUE de PR (composite e2e-pr-comment).
  # Ce workflow est appelé : github.token et github.repository sont ceux du dépôt APPELANT (source_repo), c'est donc bien sur sa PR que l'on commente.
  # Le job reste vert même si des tests échouent ou si le commentaire est refusé (fork, jeton en lecture seule).
  report:
    name: rapport (check + commentaire de PR)
    needs: [e2e]
    if: ${{ always() && (inputs.run_webapp != '' || inputs.run_android != '') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
      pull-requests: write
    outputs:
      test_results: ${{ steps.names.outputs.test_results }}
      artifact_webapp: ${{ steps.names.outputs.artifact_webapp }}
      artifact_android: ${{ steps.names.outputs.artifact_android }}
    steps:
      - name: noms des artefacts
        id: names
        env:
          SOURCE_REPO: ${{ inputs.source_repo }}
          PR_NUMBER: ${{ inputs.comment_pr_number != 0 && inputs.comment_pr_number || inputs.pr_number }}
          LABEL: ${{ inputs.report_label }}
          RUN_NUMBER: ${{ github.run_number }}
          RUN_WEBAPP: ${{ inputs.run_webapp }}
          RUN_ANDROID: ${{ inputs.run_android }}
        run: |
          LABEL="${LABEL//[^A-Za-z0-9_-]/}"
          RAW="${SOURCE_REPO}-pr${PR_NUMBER}${LABEL:+-$LABEL}"
          SLUG=$(echo "$RAW" | sed 's/[\/:<>|*?\\"]/-/g')
          prefix="test-results-${SLUG}"
          expect=""
          {
            echo "test_results=${prefix}-*-run${RUN_NUMBER}"
            [ -n "$RUN_WEBAPP" ] && { echo "artifact_webapp=${prefix}-webapp-run${RUN_NUMBER}"; expect="${expect}webapp,"; }
            [ -n "$RUN_ANDROID" ] && { echo "artifact_android=${prefix}-android-run${RUN_NUMBER}"; expect="${expect}android,"; }
            echo "expect=${expect%,}"
          } >> "$GITHUB_OUTPUT"

      # Seuls .github/ (actions et script de rapport) sont nécessaires.
      - name: checkout ami-system-tests (ref demandée)
        id: checkout-ref
        continue-on-error: true
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: numerique-gouv/ami-system-tests
          ref: ${{ inputs.checkout_ref }}
          path: ami-system-tests
          sparse-checkout: .github

      - name: checkout ami-system-tests (fallback main)
        if: steps.checkout-ref.outcome == 'failure'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: numerique-gouv/ami-system-tests
          ref: main
          path: ami-system-tests
          sparse-checkout: .github

      # Un sous-dossier par artefact (reports/<nom de l'artefact>/junit/results-*.xml). Aucun artefact (job e2e en échec avant les tests) n'est pas une erreur.
      - name: télécharger les résultats
        if: ${{ always() }}
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: ${{ steps.names.outputs.test_results }}
          path: reports

      # Check « e2e (ami-system-tests) » rattaché au commit testé (le déclencheur `on: status` du dépôt appelant s'exécute sur la branche
      # par défaut, pas sur ce commit) + annotations + résumé dans la page du run. Action tierce épinglée par SHA de commit
      # (mikepenz/action-junit-report v6.6.0, Apache-2.0) : ne jamais la référencer par tag. Le résultat du check (échec si des tests échouent)
      # n'est pas une erreur du job : fail_on_failure: false. Non vérifié en CI réelle : voir docs/adr/2026-08-04-Integration-continue-Github-Actions.md.
      - name: check et annotations (JUnit)
        if: ${{ always() }}
        uses: mikepenz/action-junit-report@b7b80d7ac5b1da46d6aaff9fb57ad50d8453bcb3 # v6.6.0
        with:
          report_paths: reports/**/junit/results-*.xml
          commit: ${{ inputs.source_sha }}
          check_name: e2e (ami-system-tests)${{ inputs.report_label != '' && format(' {0}', inputs.report_label) || '' }}
          job_summary: true
          detailed_summary: true
          fail_on_failure: false
          require_tests: false

      - name: commentaire de PR
        if: ${{ always() }}
        uses: ./ami-system-tests/.github/actions/e2e-pr-comment
        with:
          github-token: ${{ github.token }}
          repo: ${{ inputs.source_repo }}
          pr-number: ${{ inputs.comment_pr_number != 0 && inputs.comment_pr_number || inputs.pr_number }}
          junit-dir: reports
          run-url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          artifacts: ${{ steps.names.outputs.artifact_webapp }},${{ steps.names.outputs.artifact_android }}
          expect: ${{ steps.names.outputs.expect }}
          sha: ${{ inputs.source_sha }}
          label: ${{ inputs.report_label }}
