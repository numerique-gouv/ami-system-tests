name: E2E cleanup (artefacts de tests)

# Appelé par les dépôts frères (notification-api / ios / android) sur la fermeture de leur PR
# (pull_request: types: [closed]) — supprime les artefacts de tests associés (JUnit et dumps d'échec publiés
# par workflow-e2e-main.yml : `test-results-<slug>-<plateforme>-run<N>`) pour ne pas les laisser s'accumuler
# indéfiniment une fois la PR fermée. `retention-days` reste un filet de sécurité si ce dispatch échoue ou n'est
# jamais câblé côté dépôt frère (cf. docs/adr/2026-08-04-Integration-continue-Github-Actions.md).
# Ancien nom : allure-cleanup.yml (renommé lors du passage à WDIO 10 / JUnit : les dépôts frères qui le déclenchent par
# son nom doivent être mis à jour ; aucun des trois dépôts ne le référence encore à la date de ce renommage — vérifié par grep).
on:
  workflow_dispatch:
    inputs:
      source_repo:
        description: "Dépôt frère à l'origine de la PR fermée (owner/repo)"
        type: string
        required: true
      pr_number:
        description: "Numéro de la PR fermée dans source_repo"
        type: number
        required: true

permissions:
  contents: read
  # La suppression a lieu dans CE dépôt (les artifacts y ont été publiés) — le GITHUB_TOKEN
  # natif suffit, pas besoin de token cross-dépôt.
  actions: write

jobs:
  cleanup:
    name: Supprimer les artefacts de tests de la PR
    runs-on: ubuntu-latest
    steps:
      # Même calcul que dans workflow-e2e-main.yml — les deux doivent rester identiques pour
      # cibler les mêmes artefacts.
      - name: Calculer la clé d'isolation (slug)
        id: slug
        env:
          SOURCE_REPO: ${{ inputs.source_repo }}
          PR_NUMBER: ${{ inputs.pr_number }}
        run: |
          RAW="${SOURCE_REPO}-pr${PR_NUMBER}"
          SLUG=$(echo "$RAW" | sed 's/[\/:<>|*?\\"]/-/g')
          echo "slug=$SLUG" >> "$GITHUB_OUTPUT"

      - name: Supprimer les artefacts test-results-<slug>-*
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SLUG: ${{ steps.slug.outputs.slug }}
          REPOSITORY: ${{ github.repository }}
        run: |
          IDS=$(gh api "repos/$REPOSITORY/actions/artifacts?per_page=100" --paginate | \
            jq -r --arg slug "$SLUG" \
              '.artifacts[] | select(.name | startswith("test-results-" + $slug + "-")) | .id')
          if [ -z "$IDS" ]; then
            echo "Aucun artefact de tests trouvé pour $SLUG."
            exit 0
          fi
          for id in $IDS; do
            echo "Suppression de l'artefact $id"
            gh api -X DELETE "repos/$REPOSITORY/actions/artifacts/$id"
          done
