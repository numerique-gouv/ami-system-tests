name: Notification API — Android

# se lance en local depuis la racine du projet avec:
# act workflow_dispatch -W .github/workflows/system-tests-E2E.yml --container-architecture linux/amd64 --input ref_name=staging --input run_android=true --artifact-server-path /tmp/act-artifacts
# --artifact-server-path : sans ce flag, actions/upload-artifact échoue en local avec
# "Unable to get the ACTIONS_RUNTIME_TOKEN env variable" — act n'expose l'API Actions Runtime
# (ACTIONS_RUNTIME_URL/TOKEN) que si on lui fournit un serveur d'artefacts local à cet effet.
# Workflow réutilisable, appelé par system-tests-E2E.yml.
# Stub pour l'instant : la vraie suite Android (via `just test-android-suite`,
# émulateur Pixel_modern) sera branchée dans un ticket ultérieur.
on:
  workflow_call:
    inputs:
      ref_name:
        type: string
        default: staging
      run_android:
        type: boolean
        default: false
      run_old_device:
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  android-E2E:
    runs-on: ubuntu-latest
    env:
      REF_NAME: ${{ inputs.ref_name }}
      RUN_ANDROID: ${{ inputs.run_android }}
      # Lu par wdio.base.conf.ts pour taguer le label Allure `run_old_device`.
      RUN_OLD_DEVICE: ${{ inputs.run_old_device }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: extractions/setup-just@v3
      - name: install project dependencies
        run: npm ci

      # L'APK est buildé par le job `build` du workflow APPELANT (ami-app-android), pas ici —
      # jamais de checkout/build cross-repo dans ami-system-tests. `download-artifact` sans
      # `repository:`/`run-id:` va chercher dans le run courant : un job du workflow appelant et
      # un job de CE workflow réutilisable (appelé cross-repo via workflow_call) partagent le
      # même run — comportement attendu du modèle des reusable workflows. ATTENTION : la doc
      # officielle ne confirme pas ce cas cross-repo, et dit même l'inverse pour le cas général
      # ("If you want to download artifacts from a different workflow or workflow run, you need
      # to supply a token and run identifier" —
      # https://docs.github.com/en/actions/using-workflows/storing-workflow-data-as-artifacts).
      # À valider empiriquement au premier run réel avant de considérer ce point acquis. Nom
      # d'artefact `android-apk` : convention à respecter côté ami-app-android.
      # Ignoré sous `act` : pas de job `build` réel dans ce contexte local pour l'instant.
      - name: Récupérer l'APK buildé par le workflow appelant
        if: ${{ !env.ACT }}
        uses: actions/download-artifact@v4
        with:
          name: android-apk
          path: ../ami-app-android/app/build/outputs/apk/staging/debug

      # adb (platform-tools) requis par `just start-android`. Ne pas compter sur un SDK
      # préinstallé sur le runner : cette étape installe et exporte ANDROID_HOME / ANDROID_SDK_ROOT.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      # packages: 'platform-tools' (au lieu du défaut 'tools platform-tools') — le paquet
      # legacy `tools` dépend de `emulator`, indisponible pour linux-aarch64 (ex. `act` sur
      # Mac Apple Silicon), ce qui fait échouer sdkmanager avec exit code 1. `adb` (seul
      # besoin ici, via `just start-android`) vient de `platform-tools`.
      # Source : https://github.com/android-actions/setup-android/issues/283
      - uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools"
      #    accept-android-sdk-licenses: true # already true by default

      # KVM requis par reactivecircus/android-emulator-runner sur runner Linux (accélération
      # matérielle) — les runners GitHub-hosted x86_64 l'exposent mais il faut ouvrir les
      # permissions du device node. https://github.com/ReactiveCircus/android-emulator-runner
      # Ignoré sous `act` : pas de démon udev dans le conteneur (/etc/udev/rules.d absent) et
      # /dev/kvm non relayé par Docker Desktop sur Mac de toute façon — non testable en local.
      # `env.ACT` est positionné par act lui-même : https://nektosact.com/usage/index.html
      - name: Activer KVM
        if: ${{ !env.ACT }}
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # Un seul des deux appareils tourne par run, choisi par `run_old_device` (porté par
      # l'appelant system-tests-E2E.yml) : le plus ancien encore ciblé (Pixel 6, Android 12 /
      # API 31) ou le plus récent (Pixel 8, Android 15 / API 35). google_apis (Play Services
      # sans le Store) : requis pour les notifications push testées par ce projet.
      # arch x86_64 : seule architecture d'image système publiée par Google pour API ≥ 31 sur
      # Linux (x86 abandonné, arm64 non disponible hors macOS — cf. le contournement adb plus haut).
      # Ignoré sous `act` (même raison que le step KVM) : sans /dev/kvm, l'émulateur tourne sans
      # accélération et n'atteint jamais adb — la step boucle jusqu'au timeout de 10 min pour rien.
      - name: Tests E2E — Pixel 6 (API 31)
        if: ${{ inputs.run_old_device && !env.ACT }}
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 31
          target: google_apis
          arch: x86_64
          profile: pixel_6
          avd-name: pixel_6_api31
          disable-animations: true
          script: just test-android-suite all
        env:
          ANDROID_DEVICE_NAME: pixel_6_api31

      - name: Tests E2E — Pixel 8 (API 35)
        if: ${{ !inputs.run_old_device && !env.ACT }}
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_8
          avd-name: pixel_8_api35
          disable-animations: true
          script: just test-android-suite all
        env:
          ANDROID_DEVICE_NAME: pixel_8_api35

      # Sous `act`, les deux steps ci-dessus sont ignorées (pas d'émulateur possible en local,
      # cf. leurs commentaires) : allure-results/ resterait vide, empêchant de tester en local
      # le step d'export d'artifact ci-dessous et la fusion côté report job. Ce résultat est
      # factice — à ne jamais confondre avec une vraie exécution de suite.
      - name: Résultat Allure factice (act uniquement)
        if: ${{ env.ACT }}
        run: |
          mkdir -p allure-results
          cat > allure-results/act-stub-result.json <<EOF
          {
            "uuid": "00000000-0000-0000-0000-00000000act1",
            "historyId": "act-stub-android",
            "name": "[act] Résultat factice — aucune suite exécutée en local",
            "fullName": "act-stub.android",
            "status": "unknown",
            "stage": "finished",
            "start": 0,
            "stop": 1,
            "labels": [
              { "name": "platform", "value": "android" },
              { "name": "run_old_device", "value": "${{ inputs.run_old_device }}" }
            ]
          }
          EOF

      # Exporté même en cas d'échec (if: always()) pour que le report Allure reflète aussi
      # les runs cassés. Le report job (system-tests-E2E.yml) le télécharge et le fusionne
      # avec les artifacts webapp/ios — publication du rapport fusionné laissée à un ticket
      # ultérieur (cf. TODO dans system-tests-E2E.yml).
      - name: Exporter les résultats Allure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-android
          path: allure-results
          retention-days: 7
          if-no-files-found: warn
