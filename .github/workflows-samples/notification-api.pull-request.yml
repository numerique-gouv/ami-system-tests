name: "[exemple] Caller — ami-notifications-api"

# Stand-in pour le VRAI workflow qui vit dans ami-notifications-api (déclenché par PR/push sur ce
# dépôt frère) : `ami-notifications-api/.github/workflows/workflow-e2e-webapp-shared.yml`,
# `workflow-e2e-webapp-{pr,merge,tag,manual}.yml`. Conservé ici en exemple/test local car `act` ne
# sait résoudre un `uses:` vers un reusable workflow LOCAL que dans le même dépôt (nektos/act#1423)
# — impossible de tester le vrai `uses: numerique-gouv/ami-system-tests/...@ref` cross-repo sans
# un run GitHub réel.
#
# Le job `e2e-report` ci-dessous télécharge l'artefact exposé par workflow-e2e-main.yml (output
# `allure_report`) et appelle lui-même allure-framework/allure-action@v0 : c'est ce dépôt frère
# qui a la PR (github.token et permissions natifs, pas de token d'App GitHub), donc c'est lui qui
# commente — workflow-e2e-main.yml ne fait qu'exposer l'artefact en sortie.
#
# Se lance en local avec :
# act workflow_dispatch -W .github/workflows/notification-api.pull-request.yml --container-architecture linux/amd64 --artifact-server-path /tmp/act-artifacts --input pr_number=123456789
on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Simule github.event.pull_request.number — 0 pour simuler un push/tag sans PR"
        type: number
        default: 0

jobs:
  # Pas de job `build` ici, contrairement à l'exemple ami-app-android : l'app webapp testée vient
  # des stores beta (Google Play / TestFlight), pas d'un artefact buildé par ce workflow.
  e2e-launch:
    uses: ./.github/workflows/workflow-e2e-main.yml
    with:
      ref_name: staging
      run_webapp: CI
      run_android: ''
      run_ios: ''
      run_old_device: true
      source_repo: ${{ github.repository }}
      source_sha: ${{ github.sha }}
      checkout_ref: main
      pr_number: ${{ inputs.pr_number }}
    secrets: inherit

  e2e-report:
    needs: e2e-launch
    if: ${{ always() && inputs.pr_number != 0 }}
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      checks: write
    steps:
      # download-artifact sans repository:/run-id: → cherche dans le run courant, qui inclut le
      # job `e2e` de workflow-e2e-main.yml (appelé via workflow_call ci-dessus) : aucun token.
      - name: Récupérer le rapport Allure généré par ami-system-tests
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.e2e-launch.outputs.allure_report }}
          path: allure-report

      # En conditions réelles (déclenché par pull_request dans ami-notifications-api),
      # allure-action poste vraiment sur `context.payload.pull_request.number`. Ici
      # (workflow_dispatch local, pas de vraie PR), on se contente de vérifier que le
      # téléchargement a fonctionné plutôt que d'appeler l'action pour de faux.
      - name: Vérifier le rapport récupéré (local uniquement)
        if: ${{ env.ACT }}
        run: ls -la allure-report

      - name: Commenter la PR d'origine
        if: ${{ !env.ACT }}
        uses: allure-framework/allure-action@v0
        with:
          report-directory: allure-report
          github-token: ${{ github.token }}

  # Run sans PR (pr_number == 0, simule un push/tag) : pas de job e2e-report dans ce cas — pas
  # encore défini côté ami-notifications-api ce qu'il doit advenir du rapport sur ce chemin.
  no-pr-placeholder:
    needs: e2e-launch
    if: ${{ always() && inputs.pr_number == 0 }}
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "TODO: publier l'artefact ${{ needs.e2e-launch.outputs.allure_report }} ailleurs qu'en commentaire de PR (site statique privé ?)."
