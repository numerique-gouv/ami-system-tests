name: e2e-android
description: Lance la suite E2E Android (émulateur) — exécuté inline dans le job appelant, pas de VM dédiée.

inputs:
  suite:
    description: "Suite nommée mobile (définie dans wdio.base.conf.ts), ex: mobile_short (mise au point), mobile_all (PR/merge/tag), mobile_smoke"
    required: false
    default: mobile_short
  device:
    description: "Nom de l'AVD, au format pixel_<profil>_api<niveau> (ex. pixel_8_api36) : le profil et le niveau d'API de l'AVD en sont déduits."
    required: false
    default: pixel_8_api36

  apk-run-id:
    description: "vide = l'APK est l'artefact `apk-artifact` du run COURANT (buildé par le workflow appelant). Renseigné = identifiant du run d'un AUTRE dépôt/run dont on télécharge l'artefact (nécessite apk-repository et apk-token)."
    required: false
    default: ''
  apk-artifact:
    description: "nom de l'artefact contenant app-staging-debug.apk"
    required: false
    default: app-staging-debug
  apk-repository:
    description: "owner/nom du dépôt qui a produit l'artefact (utilisé seulement avec apk-run-id)"
    required: false
    default: ''
  apk-token:
    description: "jeton avec `actions: read` sur apk-repository (dépôt privé : PAT à portée limitée ou GitHub App) ; utilisé seulement avec apk-run-id"
    required: false
    default: ''

runs:
  using: composite
  steps:
    # Résout une fois les paramètres de l'appareil (API, profil, nom d'AVD), réutilisés par les steps suivants (cache AVD, création, tests).
    - name: Résoudre les paramètres de l'appareil Android
      shell: bash
      env:
        DEVICE: ${{ inputs.device }}
      run: |
        # Le nom de l'AVD est aussi lu par src/driver/capabilities.ts (appium:deviceName). Le profil et l'API sont déduits du nom :
        # tout `pixel_<profil>_api<niveau>` est accepté. L'émulateur est le seul appareil adb, donc pas d'ANDROID_UDID.
        if [[ ! "$DEVICE" =~ ^pixel_([0-9]+[a-z_]*)_api([0-9]+)$ ]]; then
          echo "::error::device « $DEVICE » invalide : format attendu pixel_<profil>_api<niveau> (ex. pixel_8_api36)"
          exit 1
        fi
        echo "ANDROID_DEVICE_NAME=$DEVICE"                 >> "$GITHUB_ENV"
        echo "ANDROID_API_LEVEL=${BASH_REMATCH[2]}"        >> "$GITHUB_ENV"
        echo "ANDROID_TARGET=google_apis"                  >> "$GITHUB_ENV"
        echo "ANDROID_ARCH=x86_64"                         >> "$GITHUB_ENV"
        echo "ANDROID_PROFILE=pixel_${BASH_REMATCH[1]}"    >> "$GITHUB_ENV"

    # L'APK doit atterrir là où ANDROID_APP_PATH le cherche (étape « Lancer les tests E2E ») : ami-app-android/app/build/outputs/apk/staging/debug/,
    # relatif à $GITHUB_WORKSPACE et non à ami-system-tests/.
    - name: Récupérer l'APK buildé par le workflow appelant
      if: ${{ inputs.apk-run-id == '' }}
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: ${{ inputs.apk-artifact }}
        path: ami-app-android/app/build/outputs/apk/staging/debug

    # APK d'un autre run (dernier tag d'ami-app-android) : même destination.
    - name: Récupérer l'APK d'un autre run
      if: ${{ inputs.apk-run-id != '' }}
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: ${{ inputs.apk-artifact }}
        path: ami-app-android/app/build/outputs/apk/staging/debug
        repository: ${{ inputs.apk-repository }}
        run-id: ${{ inputs.apk-run-id }}
        github-token: ${{ inputs.apk-token }}

    # adb est requis par `onPrepare` de wdio.android.conf.ts et par Appium : on installe le SDK plutôt que de compter sur le runner.
    - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
      with:
        distribution: temurin
        java-version: "17"

    # Cache de platform-tools. Sa clé ne suit pas la version amont : pour forcer une mise à jour, changer le suffixe (v1 → v2).
    - name: Mettre en cache platform-tools
      id: cache-platform-tools
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ env.ANDROID_SDK_ROOT }}/platform-tools
        key: ${{ runner.os }}-android-platform-tools-v1

    # Seul `platform-tools` est installé (adb) : le paquet `tools` dépend d'`emulator`, indisponible sur linux-aarch64
    # (https://github.com/android-actions/setup-android/issues/283).
    - if: steps.cache-platform-tools.outputs.cache-hit != 'true'
      uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
      with:
        packages: "platform-tools"

    # Contournement : android-emulator-runner utilise le cmdline-tools/latest préinstallé sur le runner, trop ancien pour le profil `pixel_8`
    # (« No device found matching --device »). On le supprime pour qu'il retombe sur celui de setup-android.
    - name: Supprimer le cmdline-tools/latest obsolète préinstallé sur le runner
      shell: bash
      run: rm -rf "$ANDROID_SDK_ROOT/cmdline-tools/latest"

    # Accélération matérielle de l'émulateur : KVM doit être ouvert à tous les utilisateurs (https://github.com/ReactiveCircus/android-emulator-runner).
    - name: Ouvrir KVM à tous les utilisateurs
      shell: bash
      run: |
        echo 'KERNEL=="kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
        echo 'GROUP="kvm"' | sudo tee -a /etc/udev/rules.d/99-kvm4all.rules
        echo 'MODE="0666"' | sudo tee -a /etc/udev/rules.d/99-kvm4all.rules
        echo 'OPTIONS+="static_node=kvm"' | sudo tee -a /etc/udev/rules.d/99-kvm4all.rules
        sudo udevadm control --reload-rules
        sudo udevadm trigger --name-match=kvm

    # Cache de l'AVD (image système et données de création) : sans lui, chaque run retélécharge l'image et recrée l'AVD. La clé reprend ses paramètres.
    - name: Mettre en cache l'AVD
      id: avd-cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ~/.android/avd/*
          ~/.android/adb*
        key: avd-${{ env.ANDROID_API_LEVEL }}-${{ env.ANDROID_TARGET }}-${{ env.ANDROID_ARCH }}-${{ env.ANDROID_PROFILE }}

    # Premier run seulement (cache absent) : crée l'AVD et son snapshot de démarrage, que le cache ci-dessus conserve ; les runs suivants démarrent depuis ce snapshot.
    - name: Créer l'AVD et générer le snapshot
      if: steps.avd-cache.outputs.cache-hit != 'true'
      uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
      with:
        api-level: ${{ env.ANDROID_API_LEVEL }}
        target: ${{ env.ANDROID_TARGET }}
        arch: ${{ env.ANDROID_ARCH }}
        profile: ${{ env.ANDROID_PROFILE }}
        avd-name: ${{ env.ANDROID_DEVICE_NAME }}
        force-avd-creation: false
        emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
        disable-animations: false
        script: echo "Snapshot AVD généré pour mise en cache."

    - name: Lancer les tests E2E
      uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
      # La suite passe par l'environnement (pas d'interpolation dans le script). android-emulator-runner exécute le script ligne par ligne.
      # ANDROID_APP_PATH : l'APK téléchargé plus haut ; source unique lue par src/driver/capabilities.ts.
      env:
        E2E_SUITE: ${{ inputs.suite }}
        ANDROID_APP_PATH: ${{ github.workspace }}/ami-app-android/app/build/outputs/apk/staging/debug/app-staging-debug.apk
      with:
        api-level: ${{ env.ANDROID_API_LEVEL }}
        target: ${{ env.ANDROID_TARGET }}
        arch: ${{ env.ANDROID_ARCH }}
        profile: ${{ env.ANDROID_PROFILE }}
        avd-name: ${{ env.ANDROID_DEVICE_NAME }}
        force-avd-creation: false
        disable-animations: true
        working-directory: ami-system-tests
        script: just test-android --suite "$E2E_SUITE" || echo "Test suite has failed"
