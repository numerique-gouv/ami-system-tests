name: e2e-android
description: Lance la suite E2E Android (émulateur) — exécuté inline dans le job appelant, pas de VM dédiée.

inputs:
  suite:
    description: "Suite nommée mobile (définie dans wdio.base.conf.ts), ex: mobile_short (mise au point), mobile_all (PR/merge/tag), mobile_smoke"
    required: false
    default: mobile_short
  device:
    description: "Nom de l'AVD, au format pixel_<profil>_api<niveau> (ex. pixel_2_api30 = ancien appareil, pixel_8_api36 = récent) : le profil et le niveau d'API de l'AVD en sont déduits."
    required: false
    default: pixel_2_api30

  apk-run-id:
    description: "vide = l'APK est l'artefact `apk-artifact` du run COURANT (buildé par le workflow appelant). Renseigné = identifiant du run d'un AUTRE dépôt/run dont on télécharge l'artefact (nécessite apk-repository et apk-token)."
    required: false
    default: ''
  apk-artifact:
    description: "nom de l'artefact contenant app-staging-debug.apk"
    required: false
    default: app-staging-debug
  apk-repository:
    description: "owner/nom du dépôt qui a produit l'artefact (utilisé seulement avec apk-run-id)"
    required: false
    default: ''
  apk-token:
    description: "jeton avec `actions: read` sur apk-repository (dépôt privé : PAT à portée limitée ou GitHub App) ; utilisé seulement avec apk-run-id"
    required: false
    default: ''

runs:
  using: composite
  steps:
    # Résout une seule fois les paramètres de l'appareil (ancien vs récent), réutilisés par les
    # 3 steps plus bas (cache AVD, création AVD + snapshot, Tests E2E) — sans ce step, ces 5
    # valeurs (api-level/target/arch/profile/avd-name) étaient dupliquées dans 6 steps distincts
    # (3 par branche ancien/récent), avec le risque de les faire diverger entre cache et
    # exécution réelle. `$GITHUB_ENV` (pas `$GITHUB_OUTPUT`) : disponible via `${{ env.X }}`
    # dans les `with:` des steps `uses:` suivants, contrairement aux outputs d'un step qui
    # demanderaient de préfixer chaque référence par `steps.<id>.outputs.`.
    #
    # API 30 (Android 11), pas 28 (Android 9) pour l'appareil ancien — cf.
    # docs/adr/2026-09-22-Chromedriver-legacy-webview-android-ancien.md. L'API 28 embarquait un
    # WebView Chrome 66-69 (2018), antérieur de ~2 ans à ES2020 (optional chaining/nullish
    # coalescing, apparus avec Chrome 80/V8 8.0, fév. 2020) et pile dans la plage des binaires
    # Chromedriver 2.39-2.44 cassés (bug "alpha"/`ready` manquant côté Google, jamais corrigé
    # pour ces versions précises) — combinaison qui rendait tout pilotage Appium de cette WebView
    # impossible sans hack (transpilation de dépendances tierces, jugée trop coûteuse à
    # maintenir).
    # API 29 initialement retenue (WebView 91.0.4472.114 vérifié empiriquement sur AVD arm64
    # local — même valeur qu'API 30) puis abandonnée : un run CI réel (x86_64, l'architecture
    # des runners GitHub-hosted) a montré `chrome=74.0.3729.185` sur cette même API 29, très en
    # dessous du seuil ES2020 — le SyntaxError `?.` est réapparu. Les images x86_64 restent
    # apparemment figées près de leur version de sortie AOSP initiale (74 pour l'API 29,
    # confirmé par le dépôt `external/chromium-webview`, tag `android-10.0.0_r1`) alors que les
    # images arm64 reçoivent des révisions de maintenance plus fréquentes — un écart
    # d'architecture qui n'existait pas à ce point sur l'API 28 (66 arm64 vs 69 x86_64,
    # écart mineur). API 30 est donc retenue : sa sortie AOSP initiale (`android-11.0.0_r1`)
    # est déjà à 83 (> 80), donc viable même si l'image x86_64 CI reste figée sur ce build
    # initial comme observé pour l'API 29.
    - name: Résoudre les paramètres de l'appareil Android
      shell: bash
      env:
        DEVICE: ${{ inputs.device }}
      run: |
        # ANDROID_DEVICE_NAME sert à la fois de nom d'AVD (`with: avd-name:` des steps suivants)
        # et de valeur passée à `just ... --device` (appium:deviceName) — un seul nom pour
        # les deux usages. Le profil et le niveau d'API sont déduits du nom : n'importe quel
        # appareil `pixel_<profil>_api<niveau>` est accepté, sans liste à maintenir ici.
        if [[ ! "$DEVICE" =~ ^pixel_([0-9]+[a-z_]*)_api([0-9]+)$ ]]; then
          echo "::error::device « $DEVICE » invalide : format attendu pixel_<profil>_api<niveau> (ex. pixel_2_api30)"
          exit 1
        fi
        echo "ANDROID_DEVICE_NAME=$DEVICE"                 >> "$GITHUB_ENV"
        echo "ANDROID_API_LEVEL=${BASH_REMATCH[2]}"        >> "$GITHUB_ENV"
        echo "ANDROID_TARGET=google_apis"                  >> "$GITHUB_ENV"
        echo "ANDROID_ARCH=x86_64"                         >> "$GITHUB_ENV"
        echo "ANDROID_PROFILE=pixel_${BASH_REMATCH[1]}"    >> "$GITHUB_ENV"

    # nom produit par Gradle (basename de l'APK stagingDebug). `path` est résolu par
    # actions/download-artifact relatif à $GITHUB_WORKSPACE (racine du checkout du repo
    # appelant, ex. ami-app-android) et non à `ami-system-tests/` — `working-directory` n'a
    # aucun effet sur un step `uses:`. Le chemin doit donc placer l'APK dans
    # $GITHUB_WORKSPACE/ami-app-android/..., le dossier frère que ANDROID_APP_PATH
    # (step « Tests E2E » plus bas) désigne.
    - name: Récupérer l'APK buildé par le workflow appelant
      if: ${{ inputs.apk-run-id == '' }}
      uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
      with:
        name: ${{ inputs.apk-artifact }}
        path: ami-app-android/app/build/outputs/apk/staging/debug

    # APK d'un autre run (ex. dernier tag d'ami-app-android, utilisé par les PR/merge d'ami-notifications-api) : même destination.
    - name: Récupérer l'APK d'un autre run
      if: ${{ inputs.apk-run-id != '' }}
      uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
      with:
        name: ${{ inputs.apk-artifact }}
        path: ami-app-android/app/build/outputs/apk/staging/debug
        repository: ${{ inputs.apk-repository }}
        run-id: ${{ inputs.apk-run-id }}
        github-token: ${{ inputs.apk-token }}

    # adb (platform-tools) requis par `just start-android`. Ne pas compter sur un SDK
    # préinstallé sur le runner : cette étape installe et exporte ANDROID_HOME/ANDROID_SDK_ROOT.
    - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
      with:
        distribution: temurin
        java-version: "17"

    # `platform-tools` n'est pas versionné dans ce repo (toujours "latest" côté sdkmanager) —
    # la clé de cache n'est donc pas invalidée automatiquement à une nouvelle version amont.
    # Cache volontairement "sticky" (gain : évite un aller-retour réseau à chaque run) ; si une
    # mise à jour de platform-tools est nécessaire, changer manuellement le suffixe de clé (v1 → v2).
    - name: cache Android platform-tools
      id: cache-platform-tools
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: ${{ env.ANDROID_SDK_ROOT }}/platform-tools
        key: ${{ runner.os }}-android-platform-tools-v1

    # packages: 'platform-tools' (au lieu du défaut 'tools platform-tools') — le paquet
    # legacy `tools` dépend d'`emulator`, indisponible pour linux-aarch64, ce qui fait échouer
    # sdkmanager avec exit code 1. `adb` (seul besoin ici, via `just start-android`) vient de
    # `platform-tools`. Source : https://github.com/android-actions/setup-android/issues/283
    - if: steps.cache-platform-tools.outputs.cache-hit != 'true'
      uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
      with:
        packages: "platform-tools"

    # reactivecircus/android-emulator-runner (step "Tests E2E" plus bas) exécute
    # `avdmanager create avd --device pixel_8`. Il ne réinstalle son propre cmdline-tools que si
    # $ANDROID_HOME/cmdline-tools n'existe pas du tout — or setup-android (step ci-dessus) a
    # déjà créé ce dossier parent (avec son propre cmdline-tools récent dans un sous-dossier
    # versionné, ex. cmdline-tools/20.0). android-emulator-runner saute donc sa réinstallation
    # et pointe en dur son PATH vers cmdline-tools/latest, qui est ici l'ancien cmdline-tools
    # préinstallé sur l'image GitHub-hosted (trop vieux pour connaître le profil "pixel_8" —
    # "Error: No device found matching --device pixel_8").
    # sdkmanager --install cmdline-tools;latest ne corrige pas ça : il refuse d'écraser en place
    # un paquet d'une autre révision et installe à côté (cmdline-tools/latest-2), sans jamais
    # toucher à `latest`.
    # Fix : supprimer ce `cmdline-tools/latest` obsolète. La résolution du PATH par
    # android-emulator-runner retombe alors sur le cmdline-tools installé par setup-android
    # (déjà sur le PATH, sans avoir à connaître son numéro de version).
    - name: Supprimer le cmdline-tools/latest obsolète préinstallé sur le runner
      shell: bash
      run: rm -rf "$ANDROID_SDK_ROOT/cmdline-tools/latest"

    # `~/.appium` (APPIUM_HOME par défaut, cf. justfile) contient les binaires des drivers
    # (uiautomator2, xcuitest) téléchargés par `appium driver install` — pas couvert par le
    # cache npm de setup-node (répertoire distinct de ~/.npm). Clé sur package.json : les
    # versions de drivers sont figées dans les scripts `appium:install`/`appium:update`, donc
    # tout changement de version y invalide bien le cache.
    - name: cache Appium drivers
      id: cache-appium-drivers
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: ~/.appium
        key: ${{ runner.os }}-appium-drivers-${{ hashFiles('ami-system-tests/package.json') }}

    # `just` (pas `npm run appium:install` en direct) pour que cette installation utilise le
    # même APPIUM_HOME que `just test-android` plus bas — sinon Appium (devDependency
    # locale) bascule en mode "APPIUM_HOME projet" (node_modules/.cache/appium) à l'install,
    # et les tests cherchent les drivers dans ~/.appium : "Could not find a driver for
    # automationName 'UiAutomator2'" alors que le driver est bien installé, juste ailleurs.
    - name: Installer les drivers Appium
      if: steps.cache-appium-drivers.outputs.cache-hit != 'true'
      shell: bash
      working-directory: ami-system-tests
      run: just install-appium-drivers

    - name: debug AVD devices
      shell: bash
      run: |
        echo "ANDROID_HOME=$ANDROID_HOME"
        echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
        echo "--- cmdline-tools installés ---"
        find "$ANDROID_SDK_ROOT/cmdline-tools" -maxdepth 1 -mindepth 1 -type d | while read -r dir; do
          echo "$dir -> $(grep '^Pkg.Revision' "$dir/source.properties" 2>/dev/null || echo 'source.properties introuvable')"
        done
        echo "--- binaire sdkmanager résolu via PATH ---"
        which sdkmanager
        readlink -f "$(which sdkmanager)"
        echo "--- binaire avdmanager résolu via PATH ---"
        which avdmanager
        readlink -f "$(which avdmanager)"
        echo "--- devices connus de ce avdmanager (filtré pixel) ---"
        avdmanager list device | grep -i pixel
    # KVM requis par reactivecircus/android-emulator-runner sur runner Linux (accélération
    # matérielle) — les runners GitHub-hosted x86_64 l'exposent mais il faut ouvrir les
    # permissions du device node. https://github.com/ReactiveCircus/android-emulator-runner
    - name: Enable KVM
      shell: bash
      run: |
        echo 'KERNEL=="kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
        echo 'GROUP="kvm"' | sudo tee -a /etc/udev/rules.d/99-kvm4all.rules
        echo 'MODE="0666"' | sudo tee -a /etc/udev/rules.d/99-kvm4all.rules
        echo 'OPTIONS+="static_node=kvm"' | sudo tee -a /etc/udev/rules.d/99-kvm4all.rules
        sudo udevadm control --reload-rules
        sudo udevadm trigger --name-match=kvm

    # Cache de l'AVD (image système + données de création) — sans lui, chaque run retélécharge
    # l'image système complète et recrée l'AVD depuis zéro avant même de démarrer les tests
    # (poste le plus coûteux en temps de ce job). Clé incluant tous les paramètres qui
    # déterminent le contenu de l'AVD : un changement d'API level/target/arch/profile régénère
    # naturellement un cache neuf (ils viennent tous du step de résolution ci-dessus).
    - name: cache AVD
      id: avd-cache
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: |
          ~/.android/avd/*
          ~/.android/adb*
        key: avd-${{ env.ANDROID_API_LEVEL }}-${{ env.ANDROID_TARGET }}-${{ env.ANDROID_ARCH }}-${{ env.ANDROID_PROFILE }}

    # Ne s'exécute qu'au premier run (cache miss) : crée l'AVD et génère un snapshot de boot,
    # capturés ensuite par le step actions/cache ci-dessus (post-job). Les runs suivants
    # démarrent directement depuis ce snapshot au lieu de rebooter à froid.
    - name: créer l'AVD et générer le snapshot
      if: steps.avd-cache.outputs.cache-hit != 'true'
      uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
      with:
        api-level: ${{ env.ANDROID_API_LEVEL }}
        target: ${{ env.ANDROID_TARGET }}
        arch: ${{ env.ANDROID_ARCH }}
        profile: ${{ env.ANDROID_PROFILE }}
        avd-name: ${{ env.ANDROID_DEVICE_NAME }}
        force-avd-creation: false
        emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
        disable-animations: false
        script: echo "Snapshot AVD généré pour mise en cache."

    - name: Tests E2E
      uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
      # La suite passe par l'environnement (pas d'interpolation ${{ }} dans le script, qui s'exécute dans un shell). Le script est lu par
      # android-emulator-runner ligne par ligne (chaque ligne = une commande `sh -c`) : variables et `||` restent valides ligne à ligne.
      # ANDROID_APP_PATH : l'APK téléchargé plus haut (même chemin que `path:` des deux steps de téléchargement) ; source unique lue par
      # src/driver/capabilities.ts (le justfile ne calcule plus aucun chemin d'app).
      env:
        E2E_SUITE: ${{ inputs.suite }}
        ANDROID_APP_PATH: ${{ github.workspace }}/ami-app-android/app/build/outputs/apk/staging/debug/app-staging-debug.apk
      with:
        api-level: ${{ env.ANDROID_API_LEVEL }}
        target: ${{ env.ANDROID_TARGET }}
        arch: ${{ env.ANDROID_ARCH }}
        profile: ${{ env.ANDROID_PROFILE }}
        avd-name: ${{ env.ANDROID_DEVICE_NAME }}
        force-avd-creation: false
        disable-animations: true
        working-directory: ami-system-tests
        script: |
          just test-android --suite "$E2E_SUITE" --device "$ANDROID_DEVICE_NAME" || echo "Test suite has failed"
          echo "::group::Diagnostic logcat (buffer complet, non filtré)"
          adb logcat -d || true
          echo "::endgroup::"
          echo "::group::Diagnostic WebView (dumpsys webviewupdate)"
          adb shell dumpsys webviewupdate || true
          echo "::endgroup::"
          echo "::group::Diagnostic WebView (paquets installés)"
          adb shell pm list packages | grep -i webview || true
          echo "::endgroup::"
          echo "::group::Diagnostic log Appium (debug, avec sortie chromedriver)"
          # appium:showChromedriverLog + logLevel debug (cf. capabilities.ts / wdio.android.conf.ts)
          # font remonter ici la commande/version chromedriver réellement lancée et sa sortie au
          # moment du crash — ce fichier n'apparaît pas dans stdout, il faut le cat explicitement.
          cat .wdio-logs/appium-android.log || true
          echo "::endgroup::"
