name: e2e-android
description: Lance la suite E2E Android (émulateur) — exécuté inline dans le job appelant, pas de VM dédiée.

inputs:
  suite:
    description: "Suite nommée (test-suites.ts), ex: all, CI"
    required: false
    default: CI
  run_old_device:
    description: "old device minSdk, new device targetSdk"
    required: false
    default: "true"

runs:
  using: composite
  steps:
    # nom produit par Gradle (basename de l'APK stagingDebug).
    - name: Récupérer l'APK buildé par le workflow appelant
      uses: actions/download-artifact@v4
      with:
        name: app-staging-debug
        path: ../ami-app-android/app/build/outputs/apk/staging/debug

    # adb (platform-tools) requis par `just start-android`. Ne pas compter sur un SDK
    # préinstallé sur le runner : cette étape installe et exporte ANDROID_HOME/ANDROID_SDK_ROOT.
    - uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: "17"

    # packages: 'platform-tools' (au lieu du défaut 'tools platform-tools') — le paquet
    # legacy `tools` dépend d'`emulator`, indisponible pour linux-aarch64, ce qui fait échouer
    # sdkmanager avec exit code 1. `adb` (seul besoin ici, via `just start-android`) vient de
    # `platform-tools`. Source : https://github.com/android-actions/setup-android/issues/283
    #
    # `cmdline-tools;latest` est ajouté pour rafraîchir la liste de device profiles
    # utilisée par `avdmanager` (via reactivecircus/android-emulator-runner) — le
    # cmdline-tools préinstallé sur le runner GitHub-hosted ne connaît pas encore le
    # profil "pixel_8", ce qui fait échouer la création de l'AVD API 36 avec
    # "Error: No device found matching --device pixel_8".
    - uses: android-actions/setup-android@v4
      with:
        packages: "platform-tools cmdline-tools;latest"

    # KVM requis par reactivecircus/android-emulator-runner sur runner Linux (accélération
    # matérielle) — les runners GitHub-hosted x86_64 l'exposent mais il faut ouvrir les
    # permissions du device node. https://github.com/ReactiveCircus/android-emulator-runner
    - name: Enable KVM
      shell: bash
      run: |
        echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
        sudo udevadm control --reload-rules
        sudo udevadm trigger --name-match=kvm

    - name: Tests E2E — appareil ancien (API 28, minSdk)
      if: ${{ inputs.run_old_device == 'true' }}
      uses: reactivecircus/android-emulator-runner@v2
      with:
        api-level: 28
        target: google_apis
        arch: x86_64
        profile: pixel_2
        avd-name: pixel_2_api28
        disable-animations: true
        script: just test-android-suite "${{ inputs.suite }}" || echo "Test suite has failed"
      env:
        ANDROID_DEVICE_NAME: pixel_2_api28

    - name: Tests E2E — appareil récent (API 36, targetSdk)
      if: ${{ inputs.run_old_device != 'true' }}
      uses: reactivecircus/android-emulator-runner@v2
      with:
        api-level: 36
        target: google_apis
        arch: x86_64
        profile: pixel_8
        avd-name: pixel_8_api36
        disable-animations: true
        script: just test-android-suite "${{ inputs.suite }}" || echo "Test suite has failed"
      env:
        ANDROID_DEVICE_NAME: pixel_8_api36
