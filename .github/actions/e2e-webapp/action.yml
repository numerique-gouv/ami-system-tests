name: e2e-webapp
description: Lance la suite E2E webapp (Chrome headless) — exécuté inline dans le job appelant, pas de VM dédiée.

inputs:
  suite:
    description: "Suite nommée webapp (définie dans wdio.base.conf.ts), ex: webapp_short (mise au point), webapp_usage (PR/merge/tag), webapp_smoke, webapp_all"
    required: false
    default: webapp_short

runs:
  using: composite
  steps:
    # Les jobs restent verts même si des tests échouent (`|| echo`) : le résultat se lit dans le check et le commentaire de PR.
    - shell: bash
      working-directory: ami-system-tests
      env:
        E2E_SUITE: ${{ inputs.suite }}
      run: just test-webci-suite "$E2E_SUITE" || echo "Test suite has failed"