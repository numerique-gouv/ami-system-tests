# Face B — scénarios de src/tests/webapp/** (cible webapp, Chrome).
# Décrit le code TEL QUE LU le 2026-10-06 (specs de src/tests/webapp/*.test.ts) puis le 2026-10-15 (nonreg/ et zones-commune) : la trace
# est déclarée, pas mesurée (spec.md §9).
# Les `steps` n'énumèrent que ce que le test accomplit ET vérifie.
x-anchors:
  auth: &auth [ami-spa:$authenticated]
  home: &home [ami-spa:$authenticated, ami-spa:$on-home]
  api: &api "ami-api-partenaire:~publish-notification"
  grant: &grant "ami-api-partenaire:~grant-consent"
  check: &check "ami-api-partenaire:~check-consent"

suite:
  title: Webapp (Chrome)
  root: src/tests/webapp
  described-on: 2026-10-15
  note: "Les beforeEach `HomePage.goToHomeFromAnywhere()` posent l'état `on-home` ; ils ne sont pas répétés dans les traces."

scenarios:
  # === authentification.smoke.test.ts ===============================================================
  - id: webapp.authentication.franceconnect-to-home
    source: {file: src/tests/webapp/authentification.smoke.test.ts, describe: Authentification, it: "s'authentifie via FranceConnect et arrive sur la page d'accueil"}
    status: active
    targets: [webapp]
    tags: {epic: Authentification, feature: Authentification, severity: critical, other: [franceconnect]}
    requires: ["ami-spa:$logged-out"]
    trace:
      - {visit: "ami-spa:login"}
      - {do: "ami-spa:login#start-franceconnect", steps: [trigger, arrive]}
      - {do: "franceconnect:eidas-choice#select-eidas-low", steps: [trigger, arrive]}
      - {do: "franceconnect:credentials#submit-credentials", steps: [trigger], note: "Écrans d'onboarding conditionnels : l'arrivée sur le premier n'est pas garantie."}
      - {do: "ami-spa:welcome-passkey#dismiss", steps: [trigger], note: "no-op si absent"}
      - {do: "ami-spa:welcome-zones#skip", steps: [trigger], note: "no-op si absent"}
      - {do: "ami-spa:welcome-notifications#dismiss", steps: [trigger, arrive], note: "arrive = HomePage.assertHomeVisible"}
      - {observe: "ami-spa:home@greeting", expect: "/^Bonjour \\S+/"}

  # === deconnexion.usage.test.ts ===================================================================
  - id: webapp.deconnexion.logout-and-relogin-restores-data
    source: {file: src/tests/webapp/deconnexion.usage.test.ts, describe: Déconnexion, it: "se déconnecte après confirmation, puis se reconnecte avec les données d'origine"}
    status: active
    targets: [webapp]
    tags: {epic: Authentification, feature: Déconnexion, severity: critical, other: [franceconnect]}
    requires: *auth
    trace:
      - {observe: "ami-spa:profile@identity", note: "Capture de l'origine dans before()."}
      - {do: "ami-spa:profile#open-edit-identity", steps: [trigger, arrive], note: "dans ProfilePage.editPreferredUsername"}
      - {do: "ami-spa:edit-preferred-username#save", steps: [read-origin, mutate, read-mutation, restore], note: "La restauration est celle de la déconnexion, vérifiée après reconnexion."}
      - {do: "ami-spa:home#open-plus-menu", steps: [trigger, arrive], note: "dans ProfilePage.logout"}
      - {do: "ami-spa:plus-menu#logout", steps: [trigger, arrive]}
      - {do: "ami-spa:logout-confirm#confirm", steps: [trigger, arrive], note: "arrive = FranceConnectMirePage.waitForLoginScreen"}
      - {visit: "ami-spa:home", note: "Reconnexion : getAppToStartingState({grantConsent: false})"}
      - {visit: "ami-spa:profile"}
      - {observe: "ami-spa:profile@identity", expect: "valeurs d'origine présentes, NOMTEST absent"}
    cleanup:
      - {restores: "ami-spa:profile@identity", by: logout, assured: asserted}
      - {restores: "ami-spa:profile@identity", by: after-hook, assured: best-effort, note: "Filet si le test échoue avant la déconnexion."}

