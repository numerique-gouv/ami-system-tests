# Face A — écrans natifs des apps Android et iOS (hors WebView).
# Seul le picker d'environnement est utilisé par les tests. Les autres écrans sont connus par le
# code des dépôts frères ou par docs/process/reconstruction-modele-applicatif.md : non confirmés.
x-evidence:
  code: &code {evidence: code}
  unc: &unc {evidence: unconfirmed}

app: ami-native
title: Écrans natifs AMI (Android, iOS)
kind: native
targets: [android, ios]
sources:
  - {ref: src/pages/franceconnect/environment-picker.page.ts}
  - {ref: docs/process/reconstruction-modele-applicatif.md}
screens:
  environment-picker:
    title: Sélecteur d'environnement de review
    kind: native
    entry: true
    page-object: EnvironmentPickerPage
    identity: {note: "EnvironmentPickerPage.reviewEnvironmentPicker() — présent dans les builds de review uniquement"}
    <<: *code
    source: src/tests/mobile/authentication.test.ts
    actions:
      select-review-environment:
        kind: navigate
        label: Choisir l'environnement (AMI_ENV)
        via: button
        to: "ami-spa:login"
        note: "L'URL backend des appels d'API est fixée ici (setBackendUrl)."
        <<: *code
  wifi-error:
    title: Erreur réseau native (Android)
    kind: native
    targets: [android]
    <<: *unc
    source: "../ami-app-android : networkManager/WifiErrorScreen.kt"
    note: "Non atteignable sans couper la connectivité de l'émulateur (reconstruction-modele-applicatif.md § Limites)."
  ios-settings:
    title: Réglages natifs (iOS)
    kind: native
    targets: [ios]
    <<: *unc
    source: "../ami-app-ios : Presentation/Settings/SettingsView.swift"
    note: "Non atteint par la séquence de démarrage."
  ios-partner:
    title: Écran partenaire natif (iOS)
    kind: native
    targets: [ios]
    <<: *unc
    source: "../ami-app-ios : Presentation/Partner/PartnerView.swift"
    note: "Non atteint par la séquence de démarrage."
