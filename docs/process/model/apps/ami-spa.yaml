    title: Préférences — Suivi des démarches (consentements)
    kind: page
    route: /preferences/consents
    identity: {route: /preferences/consents}
    <<: *live
    observables:
      consent-states: {label: Une case par partenaire, type: toggles, source: user-data, evidence: code}
      consent-labels: {label: Libellés des partenaires, type: list, source: static, evidence: code}
      consent-warning: {label: "Toast « Attention » à la désactivation d'un consentement", type: text, source: derived, evidence: live, note: "Observé le 2026-10-15 (consentement.md) en décochant AMI : « Si vous avez des démarches AMI en cours ou à venir, vous ne pourrez plus les suivre dans l'application. L'historique de vos démarches est conservé. » (bouton « Fermer le toast »). Sort réel des démarches déjà synchronisées : non défini, question à poser à Édouard."}
    actions:
      toggle-consent:
        kind: switch
        label: Suivre ou ne plus suivre un partenaire
        toggle: consent-states
        gates:
          capability: "Suivi des démarches : l'invitation « Je veux suivre mes démarches » est proposée tant qu'aucun consentement n'est actif"
          absent-probe: "home@follow-button"
          present-probe: "home@follow-button"
          evidence: live
        params:
          partner: ["dinum-ami", "dinum-dn", "dinum-rdvsp", "psl", "Test", "test-test"]
          per-value: false
        risk: [shared-data]
        note: "Observé le 2026-10-15 (consentement.md) : sans aucun consentement le bouton est visible sur l'Accueil et le Suivi ; avec Démarche Numérique seul il disparaît. 4 cases en préprod, 6 en staging. Le consentement AMI (dinum-ami) est aussi pilotable par l'API (grant-consent / check-consent). La case et le consentement API restent à relier avec certitude."
        <<: *live15
      follow-all:
        kind: switch
        label: Tout suivre
        toggle: consent-states
        gates:
          capability: "Suivi de tous les partenaires"
          absent-probe: "consent-states"
          present-probe: "consent-states"
          evidence: live
        risk: [shared-data]
        note: "Observé le 2026-10-15 (consentement.md) : coche les 4 cases, état persisté après rechargement."
        <<: *live15

