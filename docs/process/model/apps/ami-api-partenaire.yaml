# Face A — API partenaire AMI : alimente les écrans en données. Aucun écran, des opérations.
# Les réponses en erreur (401, 400…) viennent des tests du backlog, non implémentés.
x-evidence:
  code: &code {evidence: code}

app: ami-api-partenaire
title: API partenaire AMI (backend)
kind: api
targets: [http]
sources:
  - {ref: src/helpers/partner-api/}
  - {ref: src/tests/next/publications_partenaires/api-notification-entrante.test.ts, note: "contrats de réponse (backlog)"}
note: "L'URL de base est fixée à l'exécution par le picker d'environnement mobile ou par AMI_ENV (webapp). Secrets NOTIF_* dans .env, jamais reproduits ici."
operations:
  publish-notification:
    title: Publier une notification (et alimenter le suivi d'une démarche)
    method: PUT
    path: /api/v2/event
    auth: HTTP Basic (partenaire)
    client: "publishNotification() — src/helpers/partner-api/publish.ts (via publishEvent(), src/helpers/partner-api/event.ts)"
    feeds:
      - "ami-spa:notifications@inbox"
      - "ami-spa:home@procedures-block"
      - "ami-spa:followup@demarches"
      - "ami-spa:followup-item@status"
      - "ami-spa:followup-item@reference"
      - "ami-spa:followup-item@history"
      - "ami-spa:followup-item@external-link"
      - "ami-spa:followup-item@title"
      - "ami-spa:followup-item@children"
      - "ami-spa:agenda@events"
    responses:
      - {status: 401, when: "Basic Auth invalide (aucune notification créée)", evidence: backlog}
      - {status: 400, when: "payload invalide", evidence: backlog}
    note: "Retente jusqu'à 5 fois sur 5xx, délai 10 s. Le statut de démarche (itemGenericStatus) vaut new, wip ou closed."
    <<: *code
  check-consent:
    title: Lire le consentement d'un usager
    method: GET
    path: "/api/v1/consent/{fc_hash}"
    auth: HTTP Basic (partenaire)
    client: "checkConsent()"
    note: "200 : consentement actif ; 404 : absent ou retiré."
    <<: *code
  grant-consent:
    title: Accorder ou retirer le consentement d'un usager
    method: POST
    path: "/api/v1/consent/{fc_hash}"
    auth: HTTP Basic (partenaire)
    client: "grantConsent()"
    note: "Appelé lors de l'authentification (getAppToStartingState, option grantConsent)."
    <<: *code
